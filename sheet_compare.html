<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Comparação das vistas</title>
<style>html,body{margin:0;background:#666;font:14px system-ui;color:#fff}.r{display:flex;gap:30px;padding:14px;align-items:flex-start}canvas{image-rendering:pixelated;background:#666}</style></head>
<body><div class="r"><div><div>Original (IA)</div><canvas id="o" width="1031" height="1024" style="width:515px;height:512px"></canvas></div><div><div>Convertido</div><canvas id="c"></canvas></div></div>
<script src="sprite_set.js"></script>
<script>
const S = SPRITE_SET, k = 7, c = document.getElementById('c'); c.width = 1031 * .5 + 40; c.height = 512; const x = c.getContext('2d');
x.fillStyle = '#666'; x.fillRect(0, 0, c.width, c.height);
let ox = 10;
for (const n of ['frente', 'perfil', 'costas']) {
  const v = S[n]; const oy = n === 'costas' ? 10 + 46 * 5 + 20 : 10;
  const kk = 5;
  v.rows.forEach((r, y) => [...r].forEach((ch, i) => { if (ch !== '.') { x.fillStyle = S.pal[ch]; x.fillRect(ox + i * kk, oy + y * kk, kk, kk); } }));
  ox += v.w * kk + 20;
  if (n === 'perfil') ox = 10 + 0;
}
const img = new Image(); img.onload = () => document.getElementById('o').getContext('2d').drawImage(img, 0, 0); img.src = 'sheet6.jpg';
</script></body></html>
