<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>NE ao lado da E</title>
<style>body{margin:0;background:#202020;color:#eee;font:14px system-ui;padding:14px}h3{margin:6px 0}.r{display:flex;gap:40px;align-items:flex-end;background:#8c8c8c;padding:14px 24px;border-radius:6px;margin-bottom:16px;width:max-content;position:relative}.c{text-align:center;color:#111}canvas{image-rendering:pixelated;display:block}.line{position:absolute;left:0;right:0;height:0;border-top:1px dashed #c33}</style></head>
<body><h3>Parado (E à esquerda, NE à direita) — mesma linha do chão</h3><div class="r" id="a"></div>
<h3>Andando, um quadro de cada (E à esquerda, NE à direita)</h3><div class="r" id="b"></div>
<script src="sprites7.js"></script><script src="idles.js"></script><script>
const K = 8;
function mk(rows, pal, flip) { const c = document.createElement('canvas'); c.width = rows[0].length * K; c.height = rows.length * K; const x = c.getContext('2d'); if (flip) { x.translate(c.width, 0); x.scale(-1, 1); } rows.forEach((r, y) => { for (let q = 0; q < r.length; q++) if (r[q] !== '.') { x.fillStyle = pal[r[q]]; x.fillRect(q * K, y * K, K, K); } }); return c; }
function add(id, rows, pal, flip, label) { const d = document.createElement('div'); d.className = 'c'; d.appendChild(mk(rows, pal, flip)); d.append(label + ' · ' + rows.length + ' de altura'); document.getElementById(id).appendChild(d); }
add('a', IDLES.W.rows, IDLES.pal, true, 'E parado');
add('a', IDLES.NW.rows, IDLES.pal, true, 'NE parado');
add('b', SPR7.slots.walkW.frames[0], SPR7.pal, true, 'E andando (quadro 0)');
add('b', SPR7.slots.walkNW.frames[0], SPR7.pal, true, 'NE andando (quadro 0)');
</script></body></html>
