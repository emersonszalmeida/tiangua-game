<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tianguá — mato</title>
<style>
html,body{margin:0;height:100%;background:#1b2a1e;overflow:hidden;font-family:system-ui,sans-serif}
canvas#g{display:block}
#hud{position:fixed;left:10px;top:10px;color:#fff;font-size:13px;text-shadow:0 1px 3px #000;pointer-events:none}
#cred{position:fixed;right:8px;bottom:6px;color:#fff;font-size:11px;opacity:.85;text-shadow:0 1px 2px #000}
#cross{position:fixed;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:rgba(255,255,255,.65);pointer-events:none}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,22,16,.6);color:#fff;font-size:18px;text-align:center;cursor:pointer}
</style></head><body>
<canvas id="g"></canvas><div id="cross"></div>
<div id="hud"><div style="font-size:16px;font-weight:600" id="where">…</div><div id="near" style="opacity:.9"></div>
<div style="opacity:.75;margin-top:4px">WASD: andar · Shift: correr · Espaço: pular · mouse: olhar · Esc: soltar o mouse</div></div>
<canvas id="mm" width="200" height="200" style="position:fixed;left:10px;bottom:10px;border:2px solid #3d5a3a;border-radius:4px;cursor:pointer;background:#16231a"></canvas>
<div id="cred">© OpenStreetMap contributors</div>
<div id="start"><div id="startmsg">Carregando a mata…</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="area.js"></script>
<script>
window.onerror=(m,s,l,c)=>{document.getElementById("where").textContent="ERRO: "+m+" @"+l+":"+c;};
const A = window.AREA, SX = A.sx, SZ = A.sz;
const qs = new URLSearchParams(location.search);
const WID = { motorway: 10, trunk: 10, primary: 9, secondary: 8, secondary_link: 6, tertiary: 7.5, tertiary_link: 6, residential: 6.5, unclassified: 6, living_street: 5, service: 3.6, pedestrian: 5, footway: 2, path: 2, steps: 2, track: 3, cycleway: 2 };
const NOWALK = new Set(['footway', 'path', 'steps', 'track', 'cycleway', 'service', 'pedestrian']);
const SW = 1.7;
const roadW = r => (WID[r.k] || 5.5) + (r.l > 2 ? (r.l - 2) * 3 : 0);
for (const r of A.roads) r.w = roadW(r);
const CLOCK = { x: 228, z: 267 }; // Praça do Relógio (posição estimada pelo print)
// afasta a torre da pista (a posição vinda do print é só aproximada)
for (let i = 0; i < 40; i++) {
  const c = closestOnRoads(CLOCK.x, CLOCK.z), need = (c.r ? c.r.w / 2 : 0) + SW + 7;
  if (c.d >= need) break;
  let dx = CLOCK.x - c.x, dz = CLOCK.z - c.z; const l = Math.hypot(dx, dz) || 1; dx /= l; dz /= l;
  CLOCK.x += dx * (need - c.d + .5); CLOCK.z += dz * (need - c.d + .5);
}

let seed = 12345;
const rand = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rr = (a, b) => a + (b - a) * rand();
const hash3 = (x, y, z) => { let h = Math.imul(Math.round(x * 100), 374761393) ^ Math.imul(Math.round(y * 100), 668265263) ^ Math.imul(Math.round(z * 100), 2147483647); h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; };

// ---------- renderer / cena ----------
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('g'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const FOG = 0xaec7b6;
const scene = new THREE.Scene();
scene.background = new THREE.Color(FOG); scene.fog = new THREE.Fog(FOG, 25, 210);
const camera = new THREE.PerspectiveCamera(74, 1, .1, 700);
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const hemi = new THREE.HemisphereLight(0xd8ecff, 0x6b6a42, .8); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0cf, .95);
const SUNDIR = new THREE.Vector3(-0.55, 0.62, 0.42).normalize();
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, near: 1, far: 320 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.05;
scene.add(sun); scene.add(sun.target);

// céu
const sky = new THREE.Mesh(new THREE.SphereGeometry(500, 24, 12), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { sunDir: { value: SUNDIR } },
  vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: 'varying vec3 vD; uniform vec3 sunDir; void main(){ vec3 d = normalize(vD); float h = clamp(d.y,0.,1.);' +
    ' vec3 hor = vec3(.68,.78,.71), zen = vec3(.30,.57,.86); vec3 c = mix(hor, zen, pow(h,.55));' +
    ' float s = max(dot(d, normalize(sunDir)),0.); c += vec3(1.,.85,.55)*(pow(s,48.)*.55 + pow(s,600.)*2.); gl_FragColor = vec4(c,1.); }'
}));
sky.renderOrder = -10; scene.add(sky);

// ---------- helpers de geometria ----------
function paint(g, fn) {
  const p = g.attributes.position, c = new Float32Array(p.count * 3);
  for (let i = 0; i < p.count; i++) { const k = fn(p.getX(i), p.getY(i), p.getZ(i)); c[i * 3] = k[0]; c[i * 3 + 1] = k[1]; c[i * 3 + 2] = k[2]; }
  g.setAttribute('color', new THREE.BufferAttribute(c, 3)); return g;
}
function merge(list) {
  let n = 0; for (const g of list) n += g.attributes.position.count;
  const P = new Float32Array(n * 3), C = new Float32Array(n * 3); let o = 0;
  for (const g of list) { P.set(g.attributes.position.array, o * 3); C.set(g.attributes.color.array, o * 3); o += g.attributes.position.count; }
  const m = new THREE.BufferGeometry();
  m.setAttribute('position', new THREE.BufferAttribute(P, 3)); m.setAttribute('color', new THREE.BufferAttribute(C, 3)); m.computeVertexNormals(); return m;
}
function blob(r, jit, ox, oy, oz, sy) {
  const g = new THREE.IcosahedronGeometry(r, 1).toNonIndexed(), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i), k = 1 + (hash3(x, y, z) - .5) * jit;
    p.setXYZ(i, x * k + ox, y * k * sy + oy, z * k + oz);
  }
  return paint(g, (x, y) => { const t = Math.max(.55, Math.min(1.12, .8 + (y - oy) / (r * 2.4))); return [t, t, t]; });
}
const crownGeo = merge([blob(1, .45, 0, 0, 0, .8), blob(.72, .45, .55, .35, .25, .8), blob(.66, .45, -.5, .2, -.3, .8)]);
const bushGeo = merge([blob(1, .5, 0, .35, 0, .62)]);
const trunkGeo = paint(new THREE.CylinderGeometry(.55, 1, 1, 6).translate(0, .5, 0).toNonIndexed(), (x, y) => { const t = .72 + y * .3; return [t, t, t]; });
const palmGeo = (() => {
  const leaves = [];
  for (let i = 0; i < 10; i++) {
    const g = new THREE.PlaneGeometry(1, 1, 1, 6).toNonIndexed(), p = g.attributes.position, a = i / 10 * Math.PI * 2 + rand() * .3, L = rr(3.4, 4.6);
    for (let j = 0; j < p.count; j++) {
      const u = p.getX(j) * 2, t = p.getY(j) + .5;
      let x = t * L, y = .4 + Math.sin(t * 1.2) * .9 - t * t * 2.1, z = u * .42 * (1 - .8 * t);
      p.setXYZ(j, x * Math.cos(a) - z * Math.sin(a), y, x * Math.sin(a) + z * Math.cos(a));
    }
    leaves.push(paint(g, (x, y) => { const t = .75 + Math.max(0, y + 1) * .15; return [t, t, t]; }));
  }
  return merge(leaves);
})();
const tuftTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  for (let i = 0; i < 14; i++) {
    const bx = 14 + Math.random() * 100, h = 50 + Math.random() * 70, lean = (Math.random() - .5) * 46, g = 110 + Math.random() * 90;
    x.strokeStyle = `rgb(${50 + Math.random() * 50},${g},${40 + Math.random() * 30})`; x.lineWidth = 3 + Math.random() * 3; x.lineCap = 'round';
    x.beginPath(); x.moveTo(bx, 128); x.quadraticCurveTo(bx + lean * .3, 128 - h * .6, bx + lean, 128 - h); x.stroke();
  }
  const t = new THREE.CanvasTexture(c); return t;
})();
const tuftGeo = (() => {
  const a = new THREE.PlaneGeometry(1.1, .9).translate(0, .45, 0).toNonIndexed(), b = a.clone().rotateY(Math.PI / 2);
  return merge([paint(a, () => [1, 1, 1]), paint(b, () => [1, 1, 1])]);
})();

const matFoliage = new THREE.MeshLambertMaterial({ vertexColors: true });
const matLeafDS = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
const matTuft = new THREE.MeshLambertMaterial({ map: tuftTex, vertexColors: true, alphaTest: .45, side: THREE.DoubleSide });

// ---------- instancing em blocos (com corte manual) ----------
const CH = 64, groups = new Map(), chunkMeshes = [];
const dummy = new THREE.Object3D(), col = new THREE.Color();
function addInst(kind, x, y, z, sx, sy, sz, rotY, color) {
  const key = kind + '|' + Math.floor(x / CH) + '|' + Math.floor(z / CH);
  let g = groups.get(key); if (!g) { g = { kind, cx: (Math.floor(x / CH) + .5) * CH, cz: (Math.floor(z / CH) + .5) * CH, items: [] }; groups.set(key, g); }
  g.items.push([x, y, z, sx, sy, sz, rotY, color]);
}
const KINDS = { trunk: [trunkGeo, matFoliage, true], crown: [crownGeo, matFoliage, true], palm: [palmGeo, matLeafDS, true], bush: [bushGeo, matFoliage, true], tuft: [tuftGeo, matTuft, false], lamp: null };
function flushInst() {
  for (const g of groups.values()) {
    const k = KINDS[g.kind]; if (!k) continue;
    const m = new THREE.InstancedMesh(k[0], k[1], g.items.length);
    g.items.forEach((it, i) => {
      dummy.position.set(it[0], it[1], it[2]); dummy.scale.set(it[3], it[4], it[5]); dummy.rotation.set(0, it[6], 0); dummy.updateMatrix();
      m.setMatrixAt(i, dummy.matrix); m.setColorAt(i, col.setHex(it[7]));
    });
    m.castShadow = k[2]; m.receiveShadow = false; m.frustumCulled = false;
    scene.add(m); chunkMeshes.push({ mesh: m, c: new THREE.Vector3(g.cx, 6, g.cz), r: CH * .75 + 10 });
  }
  groups.clear();
}
const frustum = new THREE.Frustum(), pmat = new THREE.Matrix4(), sph = new THREE.Sphere();
function cull() {
  camera.updateMatrixWorld(); pmat.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse); frustum.setFromProjectionMatrix(pmat);
  for (const c of chunkMeshes) {
    const d = Math.hypot(c.c.x - camera.position.x, c.c.z - camera.position.z);
    sph.center.copy(c.c); sph.radius = c.r + 12;
    c.mesh.visible = d < 235 + c.r && (d < c.r + 80 || frustum.intersectsSphere(sph));
  }
}

// ---------- textura do chão (ruas desenhadas em metros) ----------
const TW = 4096, TH = Math.round(TW * SZ / SX), PXM = TW / SX;
const gc = document.createElement('canvas'); gc.width = TW; gc.height = TH;
const g2 = gc.getContext('2d'); g2.scale(TW / SX, TH / SZ);
function noiseTile(size, base, spread, extra) {
  const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d');
  x.fillStyle = base; x.fillRect(0, 0, size, size);
  for (let i = 0; i < size * size / 5; i++) { const v = Math.random(); x.fillStyle = v < .5 ? `rgba(0,0,0,${Math.random() * spread})` : `rgba(255,255,255,${Math.random() * spread * .7})`; x.fillRect(Math.random() * size, Math.random() * size, 1 + Math.random() * 2, 1 + Math.random() * 2); }
  if (extra) extra(x, size);
  return c;
}
function pat(c) { const p = g2.createPattern(c, 'repeat'); try { p.setTransform(new DOMMatrix([SX / TW, 0, 0, SZ / TH, 0, 0])); } catch (e) { } return p; }
const asphaltP = pat(noiseTile(256, '#3c3c40', .28, (x, s) => { x.strokeStyle = 'rgba(10,10,10,.5)'; x.lineWidth = 1; for (let i = 0; i < 4; i++) { x.beginPath(); let px = Math.random() * s, py = Math.random() * s; x.moveTo(px, py); for (let j = 0; j < 6; j++) { px += (Math.random() - .5) * 40; py += (Math.random() - .5) * 40; x.lineTo(px, py); } x.stroke(); } }));
const walkP = pat(noiseTile(144, '#aaa79d', .22, (x, s) => { x.strokeStyle = 'rgba(60,58,50,.55)'; x.lineWidth = 1.5; for (let i = 0; i <= s; i += 36) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, s); x.stroke(); x.beginPath(); x.moveTo(0, i); x.lineTo(s, i); x.stroke(); } }));
const grassP = pat(noiseTile(256, '#4f7d36', .35, (x, s) => { for (let i = 0; i < 900; i++) { x.fillStyle = `rgba(${60 + Math.random() * 60},${110 + Math.random() * 70},${30 + Math.random() * 30},.5)`; x.fillRect(Math.random() * s, Math.random() * s, 1, 3 + Math.random() * 4); } }));
const dirtP = pat(noiseTile(256, '#7b6444', .3));
g2.fillStyle = grassP; g2.fillRect(0, 0, SX, SZ);
for (let i = 0; i < 140; i++) { g2.fillStyle = `rgba(${rand() < .5 ? '110,95,55' : '40,80,30'},${rr(.1, .25)})`; g2.beginPath(); g2.ellipse(rr(0, SX), rr(0, SZ), rr(4, 18), rr(4, 14), rr(0, 3), 0, 7); g2.fill(); }
for (const gr of A.greens) { g2.fillStyle = 'rgba(112,160,70,.55)'; g2.beginPath(); gr.p.forEach((p, i) => i ? g2.lineTo(p[0], p[1]) : g2.moveTo(p[0], p[1])); g2.closePath(); g2.fill(); }
// praça do relógio
g2.fillStyle = walkP; g2.beginPath(); g2.arc(CLOCK.x, CLOCK.z, 7, 0, 7); g2.fill();
g2.strokeStyle = '#85837d'; g2.lineWidth = .4; g2.beginPath(); g2.arc(CLOCK.x, CLOCK.z, 7, 0, 7); g2.stroke();
const strokeRoad = (r, w) => { g2.lineWidth = w; g2.lineJoin = 'round'; g2.lineCap = 'round'; g2.beginPath(); r.p.forEach((p, i) => i ? g2.lineTo(p[0], p[1]) : g2.moveTo(p[0], p[1])); g2.stroke(); };
for (const r of A.roads) if (!NOWALK.has(r.k)) { g2.strokeStyle = walkP; strokeRoad(r, r.w + SW * 2); }
for (const r of A.roads) if (r.k === 'pedestrian' || r.k === 'footway') { g2.strokeStyle = walkP; strokeRoad(r, r.w); }
for (const r of A.roads) if (r.k !== 'pedestrian' && r.k !== 'footway' && r.k !== 'path' && r.k !== 'steps') { g2.strokeStyle = '#7d7b75'; strokeRoad(r, r.w + .5); }
for (const r of A.roads) if (r.k !== 'pedestrian' && r.k !== 'footway' && r.k !== 'steps') { g2.strokeStyle = (r.s === 'dirt' || r.k === 'path' || r.k === 'track') ? dirtP : asphaltP; strokeRoad(r, r.w); }
// faixa central
g2.setLineDash([3.2, 4.2]); g2.lineCap = 'butt';
for (const r of A.roads) if (r.w >= 7.5 && !r.o) { g2.strokeStyle = 'rgba(232,196,64,.92)'; strokeRoad(r, .24); }
g2.setLineDash([]);
// amostras ao longo das ruas
const samples = [];
for (const r of A.roads) for (let i = 0; i + 1 < r.p.length; i++) {
  const [x1, z1] = r.p[i], [x2, z2] = r.p[i + 1], L = Math.hypot(x2 - x1, z2 - z1), tx = (x2 - x1) / (L || 1), tz = (z2 - z1) / (L || 1);
  for (let d = 0; d < L; d += 2.5) { const x = x1 + tx * d, z = z1 + tz * d; if (x > 4 && z > 4 && x < SX - 4 && z < SZ - 4) samples.push({ x, z, tx, tz, r }); }
}
// desgaste: mato nas bordas, rachaduras, manchas
for (const s of samples) {
  const nx = -s.tz, nz = s.tx, w = s.r.w;
  for (let k = 0; k < 2; k++) if (rand() < .55) {
    const side = rand() < .5 ? -1 : 1, off = side * (w / 2 + rr(-.6, SW * .9)), x = s.x + nx * off, z = s.z + nz * off, rad = rr(.3, 1.1);
    const gr = g2.createRadialGradient(x, z, 0, x, z, rad); gr.addColorStop(0, 'rgba(70,120,45,.75)'); gr.addColorStop(1, 'rgba(70,120,45,0)');
    g2.fillStyle = gr; g2.fillRect(x - rad, z - rad, rad * 2, rad * 2);
  }
  if (rand() < .05) { const x = s.x + nx * rr(-w / 2, w / 2), z = s.z + nz * rr(-w / 2, w / 2); g2.strokeStyle = 'rgba(15,15,15,.55)'; g2.lineWidth = rr(.04, .09); g2.beginPath(); g2.moveTo(x, z); let cx = x, cz = z; for (let j = 0; j < 5; j++) { cx += rr(-.7, .7); cz += rr(-.7, .7); g2.lineTo(cx, cz); } g2.stroke(); }
  if (rand() < .06) { g2.fillStyle = `rgba(15,15,15,${rr(.08, .2)})`; g2.beginPath(); g2.ellipse(s.x + nx * rr(-w / 3, w / 3), s.z + nz * rr(-w / 3, w / 3), rr(.8, 2.6), rr(.5, 1.6), rr(0, 3), 0, 7); g2.fill(); }
  if (rand() < .025) { g2.fillStyle = 'rgba(70,115,45,.85)'; g2.beginPath(); g2.ellipse(s.x + nx * rr(-w / 2, w / 2), s.z + nz * rr(-w / 2, w / 2), rr(.15, .5), rr(.15, .5), 0, 0, 7); g2.fill(); }
}
const groundTex = new THREE.CanvasTexture(gc);
groundTex.anisotropy = renderer.capabilities.getMaxAnisotropy(); groundTex.minFilter = THREE.LinearMipmapLinearFilter;

// máscara (2px/m): 128 = margem, 255 = rua/calçada/praça/igreja
const MW = Math.ceil(SX * 2), MH = Math.ceil(SZ * 2), mc = document.createElement('canvas'); mc.width = MW; mc.height = MH;
const mg = mc.getContext('2d'); mg.scale(2, 2); mg.fillStyle = '#000'; mg.fillRect(0, 0, SX, SZ);
const mstroke = (r, w, c) => { mg.strokeStyle = c; mg.lineWidth = w; mg.lineJoin = mg.lineCap = 'round'; mg.beginPath(); r.p.forEach((p, i) => i ? mg.lineTo(p[0], p[1]) : mg.moveTo(p[0], p[1])); mg.stroke(); };
for (const r of A.roads) mstroke(r, r.w + SW * 2 + 3, '#808080');
for (const r of A.roads) mstroke(r, r.w + (NOWALK.has(r.k) ? 0 : SW * 2) + .6, '#fff');
mg.fillStyle = '#fff'; mg.beginPath(); mg.arc(CLOCK.x, CLOCK.z, 9, 0, 7); mg.fill();
for (const c of A.churches) { mg.beginPath(); c.p.forEach((p, i) => i ? mg.lineTo(p[0], p[1]) : mg.moveTo(p[0], p[1])); mg.closePath(); mg.fillStyle = '#fff'; mg.fill(); mg.strokeStyle = '#fff'; mg.lineWidth = 6; mg.stroke(); }
const mdata = mg.getImageData(0, 0, MW, MH).data;
const maskAt = (x, z) => { const ix = Math.floor(x * 2), iz = Math.floor(z * 2); if (ix < 0 || iz < 0 || ix >= MW || iz >= MH) return 0; return mdata[(iz * MW + ix) * 4]; };
const inPark = (x, z) => A.greens.some(g => inPoly(x, z, g.p));
function inPoly(x, z, p) { let c = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) if ((p[i][1] > z) !== (p[j][1] > z) && x < (p[j][0] - p[i][0]) * (z - p[i][1]) / (p[j][1] - p[i][1]) + p[i][0]) c = !c; return c; }

// ---------- chão ----------
const detailTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
  const s = document.createElement('canvas'); s.width = s.height = 48; const sx = s.getContext('2d');
  for (let i = 0; i < 48; i++) for (let j = 0; j < 48; j++) { const v = 90 + Math.random() * 120; sx.fillStyle = `rgb(${v},${v},${v})`; sx.fillRect(i, j, 1, 1); }
  x.imageSmoothingEnabled = true; x.drawImage(s, 0, 0, 256, 256);
  for (let i = 0; i < 9000; i++) { const v = Math.random() * 255; x.fillStyle = `rgba(${v},${v},${v},.35)`; x.fillRect(Math.random() * 256, Math.random() * 256, 1, 1); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t;
})();
const groundMat = new THREE.MeshLambertMaterial({ map: groundTex });
groundMat.onBeforeCompile = sh => {
  sh.uniforms.detail = { value: detailTex };
  sh.vertexShader = 'varying vec2 vWP;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n vWP = (modelMatrix*vec4(transformed,1.)).xz;');
  sh.fragmentShader = 'varying vec2 vWP; uniform sampler2D detail;\n' + sh.fragmentShader.replace('#include <map_fragment>', '#include <map_fragment>\n float d1 = texture2D(detail, vWP*.55).r; float d2 = texture2D(detail, vWP*.07+.3).r; diffuseColor.rgb *= (.82 + .36*d1) * (.9 + .2*d2);');
};
const ground = new THREE.Mesh(new THREE.PlaneGeometry(SX, SZ).rotateX(-Math.PI / 2), groundMat);
ground.position.set(SX / 2, 0, SZ / 2); ground.receiveShadow = true; scene.add(ground);
const outer = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000, 20, 20).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0x486f33 }));
outer.position.set(SX / 2, -.5, SZ / 2); outer.receiveShadow = true; scene.add(outer);

// ---------- vegetação ----------
const trunks = [];
const GREENS = [0x2f5d2a, 0x3d7a33, 0x4b8a3a, 0x5a9440, 0x6a9a3c, 0x356b30, 0x8a9a3a, 0x2b5530];
const pick = a => a[Math.floor(rand() * a.length)];
const EXT = 80;
for (let gx = -EXT; gx < SX + EXT; gx += 5) for (let gz = -EXT; gz < SZ + EXT; gz += 5) {
  const x = gx + rr(0, 5), z = gz + rr(0, 5);
  if (maskAt(x, z) > 0) continue;
  const park = inPark(x, z); if (park && rand() < .55) continue;
  if (rand() < .1) continue;
  const roll = rand(), s = rr(.75, 1.5);
  if (roll < .13) { // coqueiro / palmeira
    const h = rr(7, 11) * (.9 + s * .1); addInst('trunk', x, 0, z, .22, h, .22, rand() * 6, 0x8a7a62); addInst('palm', x, h, z, s * .9, s * .9, s * .9, rand() * 6, pick([0x4c8a3a, 0x5a9a44, 0x3f7a35])); trunks.push([x, z, .25]);
  } else {
    const th = rr(2.8, 5.5) * s, cr = rr(2.2, 3.6) * s;
    addInst('trunk', x, 0, z, .3 * s, th + cr * .4, .3 * s, rand() * 6, pick([0x6b5a45, 0x5a4a3a, 0x7a6a55])); addInst('crown', x, th + cr * .35, z, cr, cr * .85, cr, rand() * 6, pick(GREENS)); trunks.push([x, z, .32 * s]);
  }
}
for (let gx = -30; gx < SX + 30; gx += 3) for (let gz = -30; gz < SZ + 30; gz += 3) {
  const x = gx + rr(0, 3), z = gz + rr(0, 3), m = maskAt(x, z);
  if (m > 200) continue;
  if (rand() < (m ? .25 : .55)) { const s = rr(.6, 1.6); addInst('bush', x, 0, z, s, s * rr(.7, 1.2), s, rand() * 6, pick(GREENS)); }
}
for (let gx = -30; gx < SX + 30; gx += 2.1) for (let gz = -30; gz < SZ + 30; gz += 2.1) {
  const x = gx + rr(0, 2.1), z = gz + rr(0, 2.1), m = maskAt(x, z);
  if (m > 200) continue;
  if (rand() < (m ? .5 : .8)) { const s = rr(.7, 1.7); addInst('tuft', x, 0, z, s, s * rr(.7, 1.3), s, rand() * 6, pick([0xcfe8a8, 0xe0f0b0, 0xa8d080, 0xf0f5c0])); }
}
flushInst();
// grade de colisão
const CG = 5, tgrid = new Map();
for (const t of trunks) { const k = Math.floor(t[0] / CG) + ',' + Math.floor(t[1] / CG); (tgrid.get(k) || tgrid.set(k, []).get(k)).push(t); }

// ---------- postes, placas, torre do relógio, catedral ----------
const lampMat = new THREE.MeshLambertMaterial({ color: 0x555a5e });
const lampG = (() => { const a = new THREE.CylinderGeometry(.07, .09, 7, 6).translate(0, 3.5, 0), b = new THREE.BoxGeometry(1.6, .08, .08).translate(.8, 7, 0), c = new THREE.BoxGeometry(.5, .12, .22).translate(1.55, 6.92, 0); return [a, b, c]; })();
let lampN = 0, lastLamp = new Map();
for (const s of samples) {
  const r = s.r; if (r.w < 6 || NOWALK.has(r.k)) continue;
  if (Math.hypot(s.x - (r._lx ?? -999), s.z - (r._lz ?? -999)) < 38) continue;
  r._lx = s.x; r._lz = s.z;
  const off = r.w / 2 + SW * .5, x = s.x + -s.tz * off, z = s.z + s.tx * off;
  for (const g of lampG) { const m = new THREE.Mesh(g, lampMat); m.position.set(x, 0, z); m.rotation.y = Math.atan2(s.tx, s.tz); m.castShadow = true; scene.add(m); }
  lampN++;
}
function signTex(txt) {
  const c = document.createElement('canvas'); c.width = 384; c.height = 96; const x = c.getContext('2d');
  x.fillStyle = '#17508a'; x.fillRect(0, 0, 384, 96); x.strokeStyle = '#fff'; x.lineWidth = 5; x.strokeRect(5, 5, 374, 86);
  x.fillStyle = '#fff'; x.font = '600 38px system-ui, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(txt, 192, 50, 350);
  return new THREE.CanvasTexture(c);
}
const short = n => n.replace('Avenida', 'Av.').replace('Rua', 'R.').replace('Prefeito', 'Pref.').replace('Deputado', 'Dep.').replace('Conselheiro', 'Cons.').replace('Trinta e Um', '31').replace('Vereadora', 'Ver.').replace('Capitão', 'Cap.').replace('Travessa', 'Trav.');
const signPole = new THREE.CylinderGeometry(.04, .04, 2.6, 5).translate(0, 1.3, 0), signPoleMat = new THREE.MeshLambertMaterial({ color: 0x777777 });
const signTexCache = new Map(); let nSigns = 0;
for (const r of A.roads) {
  if (!r.n || r.w < 5) continue;
  let L = 0; for (let i = 0; i + 1 < r.p.length; i++) L += Math.hypot(r.p[i + 1][0] - r.p[i][0], r.p[i + 1][1] - r.p[i][1]);
  if (L < 50) continue;
  let target = L * .5, acc = 0;
  for (let i = 0; i + 1 < r.p.length; i++) {
    const [x1, z1] = r.p[i], [x2, z2] = r.p[i + 1], l = Math.hypot(x2 - x1, z2 - z1);
    if (acc + l >= target) {
      const f = (target - acc) / l, tx = (x2 - x1) / l, tz = (z2 - z1) / l, off = r.w / 2 + SW + .2, x = x1 + (x2 - x1) * f - tz * off, z = z1 + (z2 - z1) * f + tx * off;
      if (x < 8 || z < 8 || x > SX - 8 || z > SZ - 8) break;
      let tx2 = signTexCache.get(r.n); if (!tx2) { tx2 = signTex(short(r.n)); signTexCache.set(r.n, tx2); }
      const pole = new THREE.Mesh(signPole, signPoleMat); pole.position.set(x, 0, z); scene.add(pole);
      const plate = new THREE.Mesh(new THREE.PlaneGeometry(1.5, .38), new THREE.MeshBasicMaterial({ map: tx2, side: THREE.DoubleSide, fog: true }));
      plate.position.set(x, 2.45, z); plate.rotation.y = Math.atan2(tx, tz); scene.add(plate); nSigns++; break;
    }
    acc += l;
  }
}
// torre do relógio
(function () {
  const stone = new THREE.MeshLambertMaterial({ color: 0xd9cfb8 }), dark = new THREE.MeshLambertMaterial({ color: 0x6b4a3a });
  const clk = document.createElement('canvas'); clk.width = clk.height = 256; const x = clk.getContext('2d');
  x.fillStyle = '#f4efe2'; x.fillRect(0, 0, 256, 256); x.strokeStyle = '#222'; x.lineWidth = 8; x.beginPath(); x.arc(128, 128, 112, 0, 7); x.stroke();
  x.lineWidth = 6; for (let i = 0; i < 12; i++) { const a = i / 12 * 6.283; x.beginPath(); x.moveTo(128 + Math.sin(a) * 92, 128 - Math.cos(a) * 92); x.lineTo(128 + Math.sin(a) * 106, 128 - Math.cos(a) * 106); x.stroke(); }
  const now = new Date(), ha = (now.getHours() % 12 + now.getMinutes() / 60) / 12 * 6.283, ma = now.getMinutes() / 60 * 6.283;
  x.lineWidth = 10; x.beginPath(); x.moveTo(128, 128); x.lineTo(128 + Math.sin(ha) * 58, 128 - Math.cos(ha) * 58); x.stroke(); x.lineWidth = 6; x.beginPath(); x.moveTo(128, 128); x.lineTo(128 + Math.sin(ma) * 88, 128 - Math.cos(ma) * 88); x.stroke();
  const face = new THREE.MeshLambertMaterial({ map: new THREE.CanvasTexture(clk) });
  const base = new THREE.Mesh(new THREE.BoxGeometry(3.4, 1.2, 3.4), stone), shaft = new THREE.Mesh(new THREE.BoxGeometry(2.2, 8, 2.2), stone);
  const head = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 3), [face, face, stone, stone, face, face]), roof = new THREE.Mesh(new THREE.ConeGeometry(2.6, 3, 4), dark);
  base.position.set(CLOCK.x, .6, CLOCK.z); shaft.position.set(CLOCK.x, 5.2, CLOCK.z); head.position.set(CLOCK.x, 10.7, CLOCK.z); roof.position.set(CLOCK.x, 13.7, CLOCK.z); roof.rotation.y = Math.PI / 4;
  for (const m of [base, shaft, head, roof]) { m.castShadow = true; m.receiveShadow = true; scene.add(m); }
  trunks.push([CLOCK.x, CLOCK.z, 1.9]); const k = Math.floor(CLOCK.x / CG) + ',' + Math.floor(CLOCK.z / CG); (tgrid.get(k) || tgrid.set(k, []).get(k)).push([CLOCK.x, CLOCK.z, 1.9]);
})();
// catedral
const churchPolys = A.churches.map(c => c.p);
for (const c of A.churches) {
  const shape = new THREE.Shape(c.p.map(p => new THREE.Vector2(p[0], -p[1])));
  const g = new THREE.ExtrudeGeometry(shape, { depth: 11, bevelEnabled: false }).rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: 0xe6dcc4 })); m.castShadow = m.receiveShadow = true; scene.add(m);
  const cx = c.p.reduce((a, p) => a + p[0], 0) / c.p.length, cz = c.p.reduce((a, p) => a + p[1], 0) / c.p.length;
  let best = c.p[0], bd = 1e9; for (const p of c.p) for (const s of samples) { const d = Math.hypot(p[0] - s.x, p[1] - s.z); if (d < bd) { bd = d; best = p; } }
  const tx = best[0] + (cx - best[0]) * .12, tz = best[1] + (cz - best[1]) * .12;
  const tower = new THREE.Mesh(new THREE.BoxGeometry(6, 26, 6), new THREE.MeshLambertMaterial({ color: 0xefe6cf })), spire = new THREE.Mesh(new THREE.ConeGeometry(4.6, 8, 4), new THREE.MeshLambertMaterial({ color: 0x7a4a36 }));
  tower.position.set(tx, 13, tz); spire.position.set(tx, 30, tz); spire.rotation.y = Math.PI / 4; for (const t of [tower, spire]) { t.castShadow = true; scene.add(t); }
  const roof = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: .8, bevelEnabled: false }).rotateX(-Math.PI / 2).translate(0, 11, 0), new THREE.MeshLambertMaterial({ color: 0x9a5a40 })); roof.castShadow = true; scene.add(roof);
}

// ---------- jogador ----------
function closestOnRoads(x, z) {
  let best = { d: 1e9 };
  for (const r of A.roads) for (let i = 0; i + 1 < r.p.length; i++) {
    const [x1, z1] = r.p[i], [x2, z2] = r.p[i + 1], dx = x2 - x1, dz = z2 - z1, L2 = dx * dx + dz * dz || 1;
    const t = Math.max(0, Math.min(1, ((x - x1) * dx + (z - z1) * dz) / L2)), px = x1 + dx * t, pz = z1 + dz * t, d = Math.hypot(x - px, z - pz);
    if (d < best.d) best = { d, x: px, z: pz, r, tx: dx / Math.sqrt(L2), tz: dz / Math.sqrt(L2) };
  }
  return best;
}
const pos = new THREE.Vector3(CLOCK.x, 1.7, CLOCK.z + 20);
{ const c = closestOnRoads(CLOCK.x, CLOCK.z); if (c.r) { pos.x = c.x; pos.z = c.z; } }
if (qs.has('x')) { pos.x = +qs.get('x'); pos.z = +qs.get('z'); }
let yaw = qs.has('yaw') ? +qs.get('yaw') : Math.atan2(-(CLOCK.x - pos.x), -(CLOCK.z - pos.z)), pitch = -.04, bob = 0, vy = 0, py = 0;
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') e.preventDefault(); });
addEventListener('keyup', e => { keys[e.code] = false; });
const cv = document.getElementById('g'), startEl = document.getElementById('start');
startEl.addEventListener('click', () => { if (ready) cv.requestPointerLock(); });
document.addEventListener('pointerlockchange', () => { startEl.style.display = document.pointerLockElement === cv ? 'none' : 'flex'; });
document.addEventListener('mousemove', e => { if (document.pointerLockElement !== cv) return; yaw -= e.movementX * .0024; pitch = Math.max(-1.45, Math.min(1.45, pitch - e.movementY * .0024)); });
const R = .4;
function free(x, z) {
  if (x < 3 || z < 3 || x > SX - 3 || z > SZ - 3) return false;
  const cx = Math.floor(x / CG), cz = Math.floor(z / CG);
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) { const a = tgrid.get((cx + i) + ',' + (cz + j)); if (a) for (const t of a) if ((t[0] - x) ** 2 + (t[1] - z) ** 2 < (t[2] + R) ** 2) return false; }
  for (const p of churchPolys) if (inPoly(x, z, p)) return false;
  return true;
}
function update(dt) {
  let f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0), s = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  const moving = f || s, run = keys.ShiftLeft || keys.ShiftRight;
  if (moving) {
    const l = Math.hypot(f, s); f /= l; s /= l; const sp = (run ? 8.5 : 4.4) * dt;
    const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
    const nx = pos.x + (fx * f + rx * s) * sp, nz = pos.z + (fz * f + rz * s) * sp;
    if (free(nx, pos.z)) pos.x = nx; if (free(pos.x, nz)) pos.z = nz;
    if (py === 0) bob += dt * (run ? 11 : 7.5);
  }
  if (keys.Space && py === 0) vy = 5.2;
  if (py > 0 || vy > 0) { vy -= 14 * dt; py = Math.max(0, py + vy * dt); if (py === 0) vy = 0; }
  camera.position.set(pos.x, 1.7 + py + (moving && py === 0 ? Math.sin(bob) * .045 : 0), pos.z);
  camera.rotation.set(pitch, yaw, 0, 'YXZ');
  sky.position.copy(camera.position);
  sun.position.set(pos.x + SUNDIR.x * 140, SUNDIR.y * 140, pos.z + SUNDIR.z * 140); sun.target.position.set(pos.x, 0, pos.z);
}

// ---------- HUD / minimapa ----------
const mm = document.getElementById('mm'), mx = mm.getContext('2d'), MMS = 200 / Math.max(SX, SZ);
const mmBase = document.createElement('canvas'); mmBase.width = mmBase.height = 200;
(function () {
  const c = mmBase.getContext('2d'); c.fillStyle = '#2d5a2c'; c.fillRect(0, 0, 200, 200); c.scale(MMS, MMS);
  for (const g of A.greens) { c.fillStyle = '#4f8a3c'; c.beginPath(); g.p.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.fill(); }
  c.strokeStyle = '#d8d2bf'; c.lineCap = 'round';
  for (const r of A.roads) { c.lineWidth = Math.max(r.w * .8, 2.4); c.beginPath(); r.p.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.stroke(); }
  c.fillStyle = '#e6dcc4'; for (const ch of A.churches) { c.beginPath(); ch.p.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.fill(); }
  c.fillStyle = '#ffd36b'; c.beginPath(); c.arc(CLOCK.x, CLOCK.z, 6, 0, 7); c.fill();
})();
mm.addEventListener('click', e => { const r = mm.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 200 / MMS, z = (e.clientY - r.top) / r.height * 200 / MMS; if (free(x, z)) { pos.x = x; pos.z = z; } });
let hudT = 0;
function hud(dt) {
  hudT -= dt; if (hudT > 0) return; hudT = .2;
  const c = closestOnRoads(pos.x, pos.z), onRoad = c.r && c.d < c.r.w / 2 + SW + 3;
  document.getElementById('where').textContent = onRoad && c.r.n ? c.r.n : 'Tianguá — CE';
  const dc = Math.hypot(pos.x - CLOCK.x, pos.z - CLOCK.z); let near = dc < 45 ? 'Praça do Relógio' : '';
  for (const ch of A.churches) { const cx = ch.p.reduce((a, p) => a + p[0], 0) / ch.p.length, cz = ch.p.reduce((a, p) => a + p[1], 0) / ch.p.length; if (Math.hypot(pos.x - cx, pos.z - cz) < 55) near = 'Catedral de Sant’Ana'; }
  document.getElementById('near').textContent = near ? 'Perto de: ' + near : '';
  mx.drawImage(mmBase, 0, 0); const mxp = pos.x * MMS, myp = pos.z * MMS;
  mx.strokeStyle = '#fff'; mx.lineWidth = 1.5; mx.beginPath(); mx.moveTo(mxp, myp); mx.lineTo(mxp - Math.sin(yaw) * 13, myp - Math.cos(yaw) * 13); mx.stroke();
  mx.fillStyle = '#ff3b30'; mx.beginPath(); mx.arc(mxp, myp, 3.5, 0, 7); mx.fill(); mx.stroke();
}

let ready = false, last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); cull(); hud(dt); renderer.render(scene, camera); requestAnimationFrame(loop);
}
ready = true; document.getElementById('startmsg').innerHTML = 'Clique para entrar na mata de Tianguá<br><small style="opacity:.8">' + trunks.length + ' árvores · ' + lampN + ' postes · ' + nSigns + ' placas</small>';
if (qs.has('nostart')) startEl.style.visibility = 'hidden';
requestAnimationFrame(loop);
