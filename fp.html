<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tianguá — primeira pessoa</title>
<style>
html,body{margin:0;height:100%;background:#9ec9e8;overflow:hidden;font-family:system-ui,sans-serif}
canvas#g{display:block}
#hud{position:fixed;left:10px;top:10px;color:#fff;font-size:13px;text-shadow:0 1px 3px #000;pointer-events:none}
#cred{position:fixed;right:8px;bottom:6px;color:#fff;font-size:11px;opacity:.85;text-shadow:0 1px 2px #000}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.7);pointer-events:none}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,15,10,.55);color:#fff;font-size:18px;text-align:center;cursor:pointer}
</style></head><body>
<canvas id="g"></canvas><div id="cross"></div>
<div id="hud"><div style="font-size:16px;font-weight:600" id="where">…</div><div id="near" style="opacity:.9"></div>
<div style="opacity:.75;margin-top:4px">WASD: andar · Shift: correr · mouse: olhar · Esc: soltar o mouse</div></div>
<canvas id="mm" width="200" height="200" style="position:fixed;left:10px;bottom:10px;border:2px solid #5b4630;border-radius:4px;cursor:pointer;background:#1c1510"></canvas>
<div id="cred">© OpenStreetMap contributors</div>
<div id="start"><div>Clique para entrar em Tianguá<br><small style="opacity:.8">primeira pessoa · protótipo</small></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="map.js"></script>
<script>
const M = window.MAP, GW = M.w, GH = M.h, T = M.t; // T metros por tile
const raw = atob(M.b64), grid = new Uint8Array(raw.length);
for (let i = 0; i < raw.length; i++) grid[i] = raw.charCodeAt(i);
const type = (x, y) => (x < 0 || y < 0 || x >= GW || y >= GH) ? 3 : grid[y * GW + x] & 7;
const hgt = (x, y) => (x < 0 || y < 0 || x >= GW || y >= GH) ? 0 : (grid[y * GW + x] & 7) === 3 ? grid[y * GW + x] >> 3 : 0;
const FLOOR = 3.4;
const rnd = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >> 13)) * 1274126177 | 0; return ((h ^ (h >> 16)) >>> 0) / 4294967295; };

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('g'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(), SKY = 0x9ec9e8;
scene.background = new THREE.Color(SKY); scene.fog = new THREE.Fog(SKY, 80, 320);
const camera = new THREE.PerspectiveCamera(72, 1, .1, 600);
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
scene.add(new THREE.HemisphereLight(0xdfeeff, 0x8a7656, .85));
const sun = new THREE.DirectionalLight(0xfff1d0, .8); sun.position.set(-60, 100, 40); scene.add(sun);
const mat = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });

// ---------- chunks ----------
const CS = 32, CR = 6, chunks = new Map();
const GC = { 0: [0.66, 0.55, 0.38], 1: [0.34, 0.34, 0.35], 4: [0.40, 0.58, 0.28], 5: [0.78, 0.70, 0.55] };
const WALLS = [[0.80, 0.42, 0.30], [0.86, 0.80, 0.62], [0.55, 0.65, 0.72], [0.78, 0.60, 0.40], [0.90, 0.88, 0.82]];
function buildChunk(cx, cy) {
  const P = [], C = [], N = [];
  const quad = (a, b, c, d, n, col) => {
    for (const v of [a, b, c, a, c, d]) { P.push(v[0], v[1], v[2]); C.push(col[0], col[1], col[2]); N.push(n[0], n[1], n[2]); }
  };
  for (let y = cy * CS; y < Math.min(GH, (cy + 1) * CS); y++) for (let x = cx * CS; x < Math.min(GW, (cx + 1) * CS); x++) {
    const t = type(x, y), x0 = x * T, z0 = y * T, x1 = x0 + T, z1 = z0 + T, k = .92 + rnd(x, y) * .16;
    if (t !== 3) {
      const c = GC[t] || GC[0];
      quad([x0, 0, z0], [x0, 0, z1], [x1, 0, z1], [x1, 0, z0], [0, 1, 0], [c[0] * k, c[1] * k, c[2] * k]);
      continue;
    }
    const h = Math.max(1, hgt(x, y)) * FLOOR, wc = WALLS[(((x >> 3) * 7 + (y >> 3) * 13) & 7) % 5], wk = .94 + rnd(x >> 1, y >> 1) * .1;
    const col = [wc[0] * wk, wc[1] * wk, wc[2] * wk];
    quad([x0, h, z0], [x0, h, z1], [x1, h, z1], [x1, h, z0], [0, 1, 0], [.55, .30, .24]); // telhado
    const sides = [[0, 1, [0, 0, 1], [x0, z1, x1, z1]], [0, -1, [0, 0, -1], [x1, z0, x0, z0]], [1, 0, [1, 0, 0], [x1, z1, x1, z0]], [-1, 0, [-1, 0, 0], [x0, z0, x0, z1]]];
    for (const [dx, dy, n, e] of sides) {
      const nh = hgt(x + dx, y + dy) * FLOOR; if (nh >= h) continue;
      quad([e[0], nh, e[1]], [e[2], nh, e[3]], [e[2], h, e[3]], [e[0], h, e[1]], n, col);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(C, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(N, 3));
  const m = new THREE.Mesh(g, mat); scene.add(m); return m;
}
function updateChunks() {
  const pcx = Math.floor(pos.x / T / CS), pcy = Math.floor(pos.z / T / CS);
  let built = 0;
  for (let r = 0; r <= CR; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
    const cx = pcx + dx, cy = pcy + dy, key = cx + ',' + cy;
    if (cx < 0 || cy < 0 || cx * CS >= GW || cy * CS >= GH || chunks.has(key) || built >= 3) continue;
    chunks.set(key, buildChunk(cx, cy)); built++;
  }
  for (const [key, m] of chunks) {
    const [cx, cy] = key.split(',').map(Number);
    if (Math.max(Math.abs(cx - pcx), Math.abs(cy - pcy)) > CR + 2) { scene.remove(m); m.geometry.dispose(); chunks.delete(key); }
  }
}

// ---------- jogador ----------
const pos = new THREE.Vector3(GW / 2 * T, 1.7, GH / 2 * T);
const qs = new URLSearchParams(location.search);
const church = M.places.find(p => p[2] === 'Igreja Matriz') || [GW / 2, GH / 2];
(function findRoad() {
  const px = +qs.get('x') || church[0], py = +qs.get('y') || church[1];
  for (let r = 0; r < 200; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++)
    if (Math.max(Math.abs(dx), Math.abs(dy)) === r && type(Math.floor(px + dx), Math.floor(py + dy)) === 1) { pos.x = (px + dx + .5) * T; pos.z = (py + dy + .5) * T; return; }
})();
let yaw = qs.has("yaw") ? +qs.get("yaw") : Math.atan2(-(church[0] * T - pos.x), -(church[1] * T - pos.z)), pitch = -0.05, bob = 0;
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; });
addEventListener('keyup', e => { keys[e.code] = false; });
const cv = document.getElementById('g'), startEl = document.getElementById('start');
if (location.search.includes('nostart')) startEl.style.visibility = 'hidden';
startEl.addEventListener('click', () => cv.requestPointerLock());
document.addEventListener('pointerlockchange', () => { startEl.style.display = document.pointerLockElement === cv ? 'none' : 'flex'; });
document.addEventListener('mousemove', e => {
  if (document.pointerLockElement !== cv) return;
  yaw -= e.movementX * .0024; pitch = Math.max(-1.4, Math.min(1.4, pitch - e.movementY * .0024));
});
const solid = (x, z) => type(Math.floor(x / T), Math.floor(z / T)) === 3;
const R = .45;
const free = (x, z) => !solid(x - R, z - R) && !solid(x + R, z - R) && !solid(x - R, z + R) && !solid(x + R, z + R);
function update(dt) {
  let f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  let s = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  const moving = f || s;
  if (moving) {
    const l = Math.hypot(f, s); f /= l; s /= l;
    const sp = (keys.ShiftLeft || keys.ShiftRight ? 9 : 4.5) * dt;
    const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
    const nx = pos.x + (fx * f + rx * s) * sp, nz = pos.z + (fz * f + rz * s) * sp;
    if (free(nx, pos.z)) pos.x = nx;
    if (free(pos.x, nz)) pos.z = nz;
    bob += dt * (keys.ShiftLeft ? 12 : 8);
  }
  camera.position.set(pos.x, 1.7 + (moving ? Math.sin(bob) * .05 : 0), pos.z);
  camera.rotation.set(pitch, yaw, 0, 'YXZ');
}

// ---------- HUD / minimapa ----------
const places = M.places.filter(p => !/^(casas?|pontos? comerciais?)$/i.test(p[2]));
const mm = document.getElementById('mm'), mx = mm.getContext('2d');
const mmBase = document.createElement('canvas'); mmBase.width = GW; mmBase.height = GH;
(function () {
  const c = mmBase.getContext('2d'), im = c.createImageData(GW, GH), pal = { 0: [60, 48, 34], 1: [200, 190, 170], 3: [176, 101, 63], 4: [95, 140, 70], 5: [225, 200, 140] };
  for (let i = 0; i < GW * GH; i++) { const col = pal[grid[i] & 7] || pal[0]; im.data[i * 4] = col[0]; im.data[i * 4 + 1] = col[1]; im.data[i * 4 + 2] = col[2]; im.data[i * 4 + 3] = 255; }
  c.putImageData(im, 0, 0);
})();
mm.addEventListener('click', e => {
  const r = mm.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * GW, y = (e.clientY - r.top) / r.height * GH;
  if (type(Math.floor(x), Math.floor(y)) !== 3) { pos.x = x * T; pos.z = y * T; }
});
const nearest = (list, maxD) => { let b = null, bd = maxD * maxD; const px = pos.x / T, py = pos.z / T; for (const s of list) { const d = (s[0] - px) ** 2 + (s[1] - py) ** 2; if (d < bd) { bd = d; b = s; } } return b; };
let hudT = 0;
function hud(dt) {
  hudT -= dt; if (hudT > 0) return; hudT = .25;
  const st = nearest(M.streets, 8), pl = nearest(places, 25);
  document.getElementById('where').textContent = st ? st[2] : 'Tianguá — CE';
  document.getElementById('near').textContent = pl ? 'Perto de: ' + pl[2] : '';
  mx.drawImage(mmBase, 0, 0, 200, 200);
  for (const p of places) if (/^Pra|^Igreja/.test(p[2])) { mx.fillStyle = '#ffd36b'; mx.fillRect(p[0] / GW * 200 - 1.5, p[1] / GH * 200 - 1.5, 3, 3); }
  const mxp = pos.x / T / GW * 200, myp = pos.z / T / GH * 200;
  mx.strokeStyle = '#fff'; mx.lineWidth = 1.5; mx.beginPath(); mx.moveTo(mxp, myp); mx.lineTo(mxp - Math.sin(yaw) * 12, myp - Math.cos(yaw) * 12); mx.stroke();
  mx.fillStyle = '#ff3b30'; mx.beginPath(); mx.arc(mxp, myp, 3.5, 0, 7); mx.fill(); mx.stroke();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); updateChunks(); hud(dt); renderer.render(scene, camera); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
