<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8"><title>Exemplo estilo Witchbrook</title>
<style>
body{margin:0;background:#2b2433;color:#eee;font:15px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{background:#4a3c5c;color:#fff;border:2px solid #6b5a82;border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit}
button.on{background:#c98a3a;border-color:#f2c27a}
canvas{background:#1e2a1e;image-rendering:pixelated;max-width:100%}
p{max-width:640px;margin:0;color:#cbbfe0;text-align:center}
</style></head><body>
<div class="bar" id="bar"></div>
<canvas id="c" width="640" height="440"></canvas>
<p id="txt"></p>
<script>
const W = 6, D = 5, TW = 48, TH = 24, HA = 70, HB = 14, SL = 14, T = .22, OX = D * TW + 40, OY = 100;
const st = { frente: 'baixa', divisoria: true, porta: true };
const P = (x, y, z) => [OX + (x - y) * TW, OY + (x + y) * TH - z];
const cv = document.getElementById('c'), g = cv.getContext('2d');
function quad(pts, fill, line = '#3a2414') { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.fillStyle = fill; g.fill(); g.strokeStyle = line; g.lineWidth = 1; g.stroke(); }
// caixa: mostra só o que a câmera vê (topo, face +y e face +x)
function box(x0, y0, x1, y1, z0, z1, c) {
  quad([P(x0, y1, z0), P(x1, y1, z0), P(x1, y1, z1), P(x0, y1, z1)], c.y);          // face +y
  quad([P(x1, y0, z0), P(x1, y1, z0), P(x1, y1, z1), P(x1, y0, z1)], c.x);          // face +x
  if (c.rodape) { const r = c.rodape;                                                // rodapé
    quad([P(x0, y1, z0), P(x1, y1, z0), P(x1, y1, z0 + r), P(x0, y1, z0 + r)], c.rc, c.rc);
    quad([P(x1, y0, z0), P(x1, y1, z0), P(x1, y1, z0 + r), P(x1, y0, z0 + r)], c.rc, c.rc); }
  quad([P(x0, y0, z1), P(x1, y0, z1), P(x1, y1, z1), P(x0, y1, z1)], c.t);          // topo
}
const PAREDE = { y: '#dcc6a0', x: '#c9b08a', t: '#f3e6cc', rodape: 8, rc: '#8a6240' };
const MURETA = { y: '#b59a78', x: '#9d8366', t: '#e5d6bb' };
const LAJE = { y: '#8a5a36', x: '#6f4528', t: '#b67a48' };
function desenha() {
  g.clearRect(0, 0, 640, 440);
  // laje do piso com espessura e tábuas
  box(0, 0, W, D, -SL, 0, LAJE);
  for (let x = 0; x < W; x++) for (let y = 0; y < D; y++) quad([P(x, y, 0), P(x + 1, y, 0), P(x + 1, y + 1, 0), P(x, y + 1, 0)], (x + y) % 2 ? '#c58a52' : '#b87d46', '#9a6538');
  // paredes do fundo (altas): x=0 (↙) e y=0 (↘), a ponta de cada uma encosta no canto
  box(0, 0, W, T, 0, HA, PAREDE);          // fundo direito (corre ↘)
  box(0, T, T, D, 0, HA, PAREDE);          // fundo esquerdo (corre ↙)
  // divisória: UMA parede só; a câmera vê uma face (a +y); a ponta mostra a espessura
  if (st.divisoria) {
    const y0 = 3, a = 2, b = W;
    if (st.porta) { box(a, y0, a + 1.2, y0 + T, 0, HA, PAREDE); box(a + 2.2, y0, b, y0 + T, 0, HA, PAREDE);
      quad([P(a + 1.2, y0, HA), P(a + 2.2, y0, HA), P(a + 2.2, y0 + T, HA), P(a + 1.2, y0 + T, HA)], PAREDE.t); }
    else box(a, y0, b, y0 + T, 0, HA, PAREDE);
  }
  // frente: nenhuma ou mureta baixa na borda da frente (mesmo desenho da parede, só mais baixa)
  if (st.frente === 'baixa') {
    box(0, D - T, W, D, 0, HB, MURETA);                    // frente esquerda (corre ↘ em y=D)
    box(W - T, 0.4, W, D - T, 0, HB, MURETA);              // frente direita (corre ↙ em x=W)
    // pilar no canto da frente
    box(W - .38, D - .38, W + .02, D + .02, 0, HB + 18, { y: '#c7ad88', x: '#a98f6b', t: '#eadcc2' });
  }
}
function menu() {
  const bar = document.getElementById('bar'); bar.innerHTML = '';
  const add = (t, on, f) => { const b = document.createElement('button'); b.textContent = t; if (on) b.className = 'on'; b.onclick = () => { f(); menu(); desenha(); }; bar.appendChild(b); };
  add('Frente: nenhuma', st.frente === 'nenhuma', () => st.frente = 'nenhuma');
  add('Frente: mureta baixa', st.frente === 'baixa', () => st.frente = 'baixa');
  add('Divisória ' + (st.divisoria ? 'ligada' : 'desligada'), st.divisoria, () => st.divisoria = !st.divisoria);
  add('Porta ' + (st.porta ? 'ligada' : 'desligada'), st.porta, () => st.porta = !st.porta);
  document.getElementById('txt').textContent = 'Paredes do fundo altas; a frente fica livre ou vira uma mureta baixa (mesmo desenho, só altura menor). A divisória é uma parede só: a câmera vê uma face e o topo.';
}
menu(); desenha();
</script></body></html>
