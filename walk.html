<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personagem andando</title>
<style>
html,body{margin:0;height:100%;background:#1a1612;overflow:hidden;font:14px system-ui,sans-serif;color:#eee}
canvas#g{display:block;width:100vw;height:100vh;image-rendering:pixelated}
#ui{position:fixed;left:12px;top:10px;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:6px;line-height:1.5}
#ui button{border:2px solid #fff3;border-radius:50%;width:26px;height:26px;margin-right:6px;cursor:pointer;vertical-align:middle}
#ui button.on{border-color:#fff}
canvas#sheet{position:fixed;right:10px;top:10px;background:rgba(0,0,0,.55);border-radius:6px;image-rendering:pixelated}
</style></head>
<body>
<canvas id="g"></canvas>
<canvas id="sheet"></canvas>
<div id="ui">WASD ou setas para andar &nbsp;·&nbsp; Shift corre<br>Cor do clã: <span id="clans"></span></div>
<script src="sprite_set.js"></script>
<script>
const S = SPRITE_SET, PAL = S.pal;
const FW = 36, FH = 50, SC = 5;
const RED = new Set(['J', 'M', 'P', 'R']);
const CFG = {
  frente: { legTop: 34, split: 13.5, cx: 13.5, side: false },
  costas: { legTop: 32, split: 13.5, cx: 13.5, side: false },
  perfil: { legTop: 35, cx: 9, side: true },
};
const CLANS = [
  ['Vermelho', null], ['Azul', [40, 110, 230]], ['Verde', [50, 170, 80]], ['Dourado', [235, 185, 40]], ['Roxo', [150, 70, 210]],
];
let clan = 0;
const FACT = { M: 1, P: .86, R: .72, J: .47 };
const hex = v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0');
function colorOf(ch, dark) {
  let c = PAL[ch];
  const cl = CLANS[clan][1];
  if (cl && FACT[ch]) c = '#' + cl.map(v => hex(v * FACT[ch])).join('');
  if (dark) { const n = parseInt(c.slice(1), 16); c = '#' + [n >> 16, (n >> 8) & 255, n & 255].map(v => hex(v * .72)).join(''); }
  return c;
}

const blank = () => Array.from({ length: FH }, () => Array(FW).fill('.'));
function put(g, src, ox, oy, filter, dark) {
  for (let y = 0; y < src.length; y++) for (let x = 0; x < src[y].length; x++) {
    const ch = src[y][x]; if (ch === '.') continue;
    if (filter && !filter(ch, x, y)) continue;
    const X = ox + x, Y = oy + y; if (X < 0 || Y < 0 || X >= FW || Y >= FH) continue;
    g[Y][X] = dark ? ch + '!' : ch;
  }
}
const isGlove = ch => RED.has(ch) || ch === 'H';

// f: 0..3 = quadros de andar; -1 = parado (b = respiração 0/1)
function build(name, f, b) {
  const rows = S[name].rows.map(r => [...r]), c = CFG[name], h = rows.length;
  const ox = Math.round(18 - c.cx), oy = FH - h;
  const upper = rows.slice(0, c.legTop), legs = rows.slice(c.legTop), g = blank();
  const walk = f >= 0, up = walk ? (f % 2 ? 1 : 0) : b;
  const ly = oy + c.legTop;
  if (!c.side) {
    const L = legs.map(r => r.map((ch, x) => x < c.split ? ch : '.')), R = legs.map(r => r.map((ch, x) => x < c.split ? '.' : ch));
    put(g, L, ox, ly - (f === 0 ? 2 : 0)); put(g, R, ox, ly - (f === 2 ? 2 : 0));
  } else {
    // perna de trás (escura) e perna da frente; cada uma balança em x
    const nearX = [0, 2, 0, -2][f < 0 ? 2 : f], farX = [0, -2, 0, 2][f < 0 ? 2 : f];
    const nearUp = f === 0 ? 2 : 0, farUp = f === 2 ? 2 : 0;
    put(g, legs, ox + (walk ? farX : 0), ly - (walk ? farUp : 0), null, true);
    put(g, legs, ox + (walk ? nearX : 0), ly - (walk ? nearUp : 0));
  }
  put(g, upper, ox, oy + up);
  // balanço dos braços: a luva "desce" 1 pixel, alternando
  if (walk) {
    const gr = f === 0 ? 1 : 0, gb = f === 2 ? 1 : 0;
    if (gr) put(g, upper, ox, oy + up + 1, ch => RED.has(ch));
    if (gb) put(g, upper, ox, oy + up + 1, ch => ch === 'H');
  }
  return g;
}
const cache = new Map();
function frameCanvas(name, f, b) {
  const k = name + f + '_' + b + '_' + clan; if (cache.has(k)) return cache.get(k);
  const g = build(name, f, b), c = document.createElement('canvas'); c.width = FW; c.height = FH; const x = c.getContext('2d');
  for (let y = 0; y < FH; y++) for (let i = 0; i < FW; i++) { const ch = g[y][i]; if (ch === '.') continue; x.fillStyle = colorOf(ch[0], ch.length > 1); x.fillRect(i, y, 1, 1); }
  cache.set(k, c); return c;
}

// ---------- chão de pedra ----------
const cv = document.getElementById('g'), ctx = cv.getContext('2d');
function resize() { cv.width = innerWidth; cv.height = innerHeight; ctx.imageSmoothingEnabled = false; }
addEventListener('resize', resize); resize();
const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const T = 56, TONES = ['#4a4339', '#51493d', '#463f35', '#58503f'];
function ground(cx, cy) {
  ctx.fillStyle = '#2b2620'; ctx.fillRect(0, 0, cv.width, cv.height);
  const x0 = Math.floor((cx - cv.width / 2) / T), x1 = Math.floor((cx + cv.width / 2) / T), y0 = Math.floor((cy - cv.height * .6) / T), y1 = Math.floor((cy + cv.height * .6) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    const r = hash(tx, ty), sx = Math.round(tx * T - cx + cv.width / 2), sy = Math.round(ty * T - cy + cv.height * .6);
    ctx.fillStyle = TONES[(r * 4) | 0]; ctx.fillRect(sx + 2, sy + 2, T - 4, T - 4);
    if (r > .7) { ctx.fillStyle = '#ffffff10'; ctx.fillRect(sx + 6, sy + 6, 12, 4); }
    if (r < .25) { ctx.fillStyle = '#00000022'; ctx.fillRect(sx + T - 20, sy + T - 14, 10, 6); }
  }
}

// ---------- jogador ----------
const P = { x: 0, y: 0, dir: 'down', moving: false, t: 0 };
const keys = new Set();
addEventListener('keydown', e => { keys.add(e.key.toLowerCase()); if (e.key.startsWith('Arrow')) e.preventDefault(); });
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
const sim = new URLSearchParams(location.search).get('sim');
const KEYMAP = { up: ['w', 'arrowup'], down: ['s', 'arrowdown'], left: ['a', 'arrowleft'], right: ['d', 'arrowright'] };
const held = d => (sim === d) || KEYMAP[d].some(k => keys.has(k));

function frameFor(dir, moving, t) {
  const name = dir === 'down' ? 'frente' : dir === 'up' ? 'costas' : 'perfil';
  const f = moving ? Math.floor(t / (keys.has('shift') ? 85 : 135)) % 4 : -1;
  return { name, f, b: moving ? 0 : (Math.floor(t / 650) % 2), flip: dir === 'left' };
}
const tmp = document.createElement('canvas'); tmp.width = FW * SC; tmp.height = FH * SC; const tx = tmp.getContext('2d');
function drawChar(sx, sy, d) {
  const img = frameCanvas(d.name, d.f, d.b), W = FW * SC, H = FH * SC;
  // sombra
  ctx.fillStyle = 'rgba(0,0,0,.38)'; ctx.beginPath(); ctx.ellipse(sx, sy - 2, 24, 7, 0, 0, 7); ctx.fill();
  // reflexo (espelhado na vertical, desvanecendo)
  tx.clearRect(0, 0, W, H); tx.save(); tx.imageSmoothingEnabled = false;
  tx.translate(d.flip ? W : 0, H); tx.scale(d.flip ? -1 : 1, -1); tx.drawImage(img, 0, 0, W, H); tx.restore();
  tx.globalCompositeOperation = 'destination-in';
  const gr = tx.createLinearGradient(0, 0, 0, H * .55); gr.addColorStop(0, 'rgba(0,0,0,.38)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  tx.fillStyle = gr; tx.fillRect(0, 0, W, H); tx.globalCompositeOperation = 'source-over';
  ctx.drawImage(tmp, sx - 18 * SC, sy);
  // personagem
  ctx.save(); ctx.imageSmoothingEnabled = false; ctx.translate(sx, sy); if (d.flip) ctx.scale(-1, 1);
  ctx.drawImage(img, -18 * SC, -H, W, H); ctx.restore();
}

// ---------- folha de quadros (canto) ----------
const sh = document.getElementById('sheet'), sx = sh.getContext('2d');
function drawSheet() {
  const k = 2, cw = FW * k, ch = FH * k; sh.width = cw * 5 + 10; sh.height = ch * 3 + 10;
  sx.imageSmoothingEnabled = false;
  ['frente', 'perfil', 'costas'].forEach((n, r) => {
    sx.drawImage(frameCanvas(n, -1, 0), 5, 5 + r * ch, cw, ch);
    for (let f = 0; f < 4; f++) sx.drawImage(frameCanvas(n, f, 0), 5 + (f + 1) * cw, 5 + r * ch, cw, ch);
  });
}
const cl = document.getElementById('clans');
CLANS.forEach((c, i) => {
  const b = document.createElement('button'); b.title = c[0]; b.style.background = c[1] ? `rgb(${c[1]})` : '#d62239'; if (!i) b.className = 'on';
  b.onclick = () => { clan = i; [...cl.children].forEach((x, j) => x.className = j === i ? 'on' : ''); drawSheet(); };
  cl.appendChild(b);
});
drawSheet();

let last = performance.now(), now0 = last;
function loop(ts) {
  const dt = Math.min(.05, (ts - last) / 1000); last = ts;
  let dx = (held('right') ? 1 : 0) - (held('left') ? 1 : 0), dy = (held('down') ? 1 : 0) - (held('up') ? 1 : 0);
  P.moving = !!(dx || dy);
  if (P.moving) {
    if (dx) P.dir = dx > 0 ? 'right' : 'left'; else P.dir = dy > 0 ? 'down' : 'up';
    const sp = (keys.has('shift') ? 260 : 170) * dt, n = Math.hypot(dx, dy); P.x += dx / n * sp; P.y += dy / n * sp;
    if (!P.t0) P.t0 = ts; P.t = ts - P.t0;
  } else { P.t0 = 0; P.t = ts; }
  ground(P.x, P.y);
  drawChar(Math.round(cv.width / 2), Math.round(cv.height * .6), frameFor(P.dir, P.moving, P.t));
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
