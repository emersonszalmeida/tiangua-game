<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Sprite — teste</title>
<style>html,body{margin:0;background:#6a6b6a;font:13px system-ui;color:#eee}canvas{image-rendering:pixelated;display:block}.row{display:flex;gap:18px;padding:14px;align-items:flex-end}</style></head>
<body><div class="row" id="row"></div><canvas id="anim" width="1200" height="560"></canvas>
<script src="sprite_lib.js"></script>
<script>
const F = makeFrames(), row = document.getElementById('row'), all = [F.idle, ...F.walk];
all.forEach((c, i) => { const v = document.createElement('canvas'); v.width = 24 * 8; v.height = 32 * 8; const x = v.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(c, 0, 0, v.width, v.height); row.appendChild(v); });
const cv = document.getElementById('anim'), ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
const S = 8, bx = 100, by = 20, baseY = by + 32 * S; let t = 0;
function draw(img, x, y, flip) { ctx.save(); ctx.translate(x + (flip ? 24 * S : 0), y); ctx.scale(flip ? -1 : 1, 1); ctx.drawImage(img, 0, 0, 24 * S, 32 * S); ctx.restore(); }
function frame() {
  ctx.fillStyle = '#6a6b6a'; ctx.fillRect(0, 0, 1200, 560);
  const f = F.walk[Math.floor(t / 140) % 4];
  const xs = [bx, bx + 330, bx + 660];
  [[xs[0], F.idle, false], [xs[1], f, false], [xs[2], f, true]].forEach(([x, img, fl]) => {
    // reflexo: invertido, escurecido e com degradê
    ctx.save(); ctx.globalAlpha = .38; ctx.translate(0, 2 * baseY + 4); ctx.scale(1, -1); draw(img, x, by, fl); ctx.restore();
    draw(img, x, by, fl);
    ctx.fillStyle = '#5bc8e0'; ctx.fillRect(x - 40, baseY, 24 * S + 80, 3);
  });
  t += 16; requestAnimationFrame(frame);
}
frame();
</script></body></html>
