<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tianguá Clãs — protótipo</title>
<style>
html,body{margin:0;height:100%;background:#1c1510;overflow:hidden;font-family:system-ui,sans-serif}
canvas{display:block;image-rendering:pixelated}
#hud{position:fixed;left:10px;top:10px;color:#f3e3c3;font-size:13px;text-shadow:0 1px 2px #000}
#cred{position:fixed;right:8px;bottom:6px;color:#c9b793;font-size:11px;opacity:.8}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div style="font-size:16px;font-weight:600" id="where">…</div><div id="near" style="opacity:.85"></div><div style="opacity:.6;margin-top:4px">WASD / setas: andar · Shift: correr · roda do mouse: zoom · clique no minimapa: ir até lá</div></div>
<canvas id="mm" width="200" height="200" style="position:fixed;left:10px;bottom:10px;border:2px solid #5b4630;border-radius:4px;cursor:pointer;image-rendering:pixelated;background:#1c1510"></canvas>
<div id="cred">© OpenStreetMap contributors</div>
<script src="map.js"></script>
<script src="sprites7.js"></script>
<script src="idles.js"></script>
<script src="personagem.js"></script>
<script>
const M = window.MAP, GW = M.w, GH = M.h;
const raw = atob(M.b64), grid = new Uint8Array(raw.length);
for (let i = 0; i < raw.length; i++) grid[i] = raw.charCodeAt(i);
const type = (x, y) => (x < 0 || y < 0 || x >= GW || y >= GH) ? 3 : grid[y * GW + x] & 7;
const hgt = (x, y) => (x < 0 || y < 0 || x >= GW || y >= GH) ? 0 : (grid[y * GW + x] & 7) === 3 ? grid[y * GW + x] >> 3 : 0;

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const ZOOMS = [1, 2, 3]; let zi = 1, zoom = ZOOMS[zi]; // zoom inteiro: pixel art sem borrar
function resize() { cv.width = innerWidth; cv.height = innerHeight; ctx.imageSmoothingEnabled = false; }
addEventListener('resize', resize); resize();
addEventListener('wheel', e => { zi = Math.max(0, Math.min(ZOOMS.length - 1, zi + (e.deltaY < 0 ? 1 : -1))); zoom = ZOOMS[zi]; });

const TW = 128, TH = 64, WALL = 100; // losango do tile (3 m, mesma escala do tileset e do personagem) e altura de um andar
const COL = {
  0: ['#a98c5e', '#9b7f53'], // terra
  1: ['#8c8478', '#7f786d'], // rua (pedra)
  4: ['#6f8f4a', '#648342'], // grama
  5: ['#b9a27a', '#ad966e']  // praça
};
const WALLCOL = [['#8a4b32', '#6e3a27', '#b0653f'], ['#c7b58a', '#a99870', '#d9c9a0'], ['#7a5a3c', '#5f452d', '#92704c'], ['#a3563a', '#833f2a', '#c06e47']];
const wallOf = (x, y) => WALLCOL[((x >> 3) * 7 + (y >> 3) * 13) & 3];

// posição do jogador em coordenadas de tile (float)
let px = GW / 2, py = GH / 2;
(function findRoad() {
  for (let r = 0; r < 200; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++)
    if (Math.max(Math.abs(dx), Math.abs(dy)) === r && type(Math.floor(px + dx), Math.floor(py + dy)) === 1) { px += dx + .5; py += dy + .5; return; }
})();

const places = M.places.filter(p => !/^(casas?|pontos? comerciais?)$/i.test(p[2]));
const mm = document.getElementById('mm'), mx = mm.getContext('2d');
const mmBase = document.createElement('canvas'); mmBase.width = GW; mmBase.height = GH;
(function () {
  const c = mmBase.getContext('2d'), im = c.createImageData(GW, GH), pal = { 0: [60, 48, 34], 1: [200, 190, 170], 3: [176, 101, 63], 4: [95, 140, 70], 5: [225, 200, 140] };
  for (let i = 0; i < GW * GH; i++) { const col = pal[grid[i] & 7] || pal[0]; im.data[i * 4] = col[0]; im.data[i * 4 + 1] = col[1]; im.data[i * 4 + 2] = col[2]; im.data[i * 4 + 3] = 255; }
  c.putImageData(im, 0, 0);
})();
mm.addEventListener('click', e => {
  const r = mm.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * GW, y = (e.clientY - r.top) / r.height * GH;
  if (type(Math.floor(x), Math.floor(y)) !== 3) { px = x; py = y; }
});
function nearest(list, maxD) {
  let best = null, bd = maxD * maxD;
  for (const s of list) { const d = (s[0] - px) ** 2 + (s[1] - py) ** 2; if (d < bd) { bd = d; best = s; } }
  return best;
}
let hudT = 0;
function hud(dt) {
  hudT -= dt; if (hudT > 0) return; hudT = .25;
  const st = nearest(M.streets, 8), pl = nearest(places, 30);
  document.getElementById('where').textContent = st ? st[2] : 'Tianguá — CE';
  document.getElementById('near').textContent = pl ? 'Perto de: ' + pl[2] : '';
  mx.drawImage(mmBase, 0, 0, 200, 200);
  mx.fillStyle = '#fff'; mx.font = '9px sans-serif';
  for (const p of places) if (/^Pra|^Igreja/.test(p[2])) { mx.fillStyle = '#ffd36b'; mx.fillRect(p[0] / GW * 200 - 1.5, p[1] / GH * 200 - 1.5, 3, 3); }
  mx.fillStyle = '#ff3b30'; mx.beginPath(); mx.arc(px / GW * 200, py / GH * 200, 3.5, 0, 7); mx.fill();
  mx.strokeStyle = '#fff'; mx.lineWidth = 1; mx.stroke();
}
const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key.startsWith('Arrow')) e.preventDefault(); });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const blocked = (x, y) => type(Math.floor(x), Math.floor(y)) === 3;

const hero = PERS.create('S');
const WALK_PX = 160 / 3, RUN_PX = 300 / 3; // px de tela por segundo, iguais ao teste_personagem.html (o passo acompanha a animação)
let last = performance.now();
function update(dt, now) {
  const kx = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
  const ky = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
  PERS.step(hero, kx, ky, !!keys.shift, now);
  if (!hero.moving) return;
  // deslocamento na tela -> tile (iso 2:1): dx = (tx-ty)*TW/2, dy = (tx+ty)*TH/2
  const l = Math.hypot(kx, ky), d = (hero.run ? RUN_PX : WALK_PX) * dt, dx = kx / l * d, dy = ky / l * d;
  const nx = px + dx / TW + dy / TH, ny = py + dy / TH - dx / TW, r = .25;
  const ok = (x, y) => !blocked(x - r, y - r) && !blocked(x + r, y - r) && !blocked(x - r, y + r) && !blocked(x + r, y + r);
  if (ok(nx, py)) px = nx;
  if (ok(px, ny)) py = ny;
}

function diamond(x, y, c) {
  ctx.fillStyle = c; ctx.beginPath();
  ctx.moveTo(x, y); ctx.lineTo(x + TW / 2, y + TH / 2); ctx.lineTo(x, y + TH); ctx.lineTo(x - TW / 2, y + TH / 2); ctx.closePath(); ctx.fill();
}
function drawBuilding(x, y, sx, sy, h) {
  const [L, R, Tp] = wallOf(x, y), H = h * WALL, top = sy - H;
  // face esquerda (vizinho y+1) e direita (vizinho x+1)
  const hl = hgt(x, y + 1) * WALL, hr = hgt(x + 1, y) * WALL;
  if (hl < H) {
    ctx.fillStyle = L; ctx.beginPath();
    ctx.moveTo(sx - TW / 2, sy + TH / 2 - H); ctx.lineTo(sx, sy + TH - H); ctx.lineTo(sx, sy + TH - hl); ctx.lineTo(sx - TW / 2, sy + TH / 2 - hl); ctx.fill();
    if (h && (x + y) % 2 === 0) { ctx.fillStyle = '#2a1d14'; ctx.fillRect(sx - TW / 2 + 24, sy + TH / 2 - H + 30, 16, 28); }
  }
  if (hr < H) {
    ctx.fillStyle = R; ctx.beginPath();
    ctx.moveTo(sx + TW / 2, sy + TH / 2 - H); ctx.lineTo(sx, sy + TH - H); ctx.lineTo(sx, sy + TH - hr); ctx.lineTo(sx + TW / 2, sy + TH / 2 - hr); ctx.fill();
  }
  diamond(sx, top, Tp);
  // telhado: pequena aresta mais escura
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1; ctx.beginPath();
  ctx.moveTo(sx - TW / 2, top + TH / 2); ctx.lineTo(sx, top + TH); ctx.lineTo(sx + TW / 2, top + TH / 2); ctx.stroke();
}
function render() {
  const W = cv.width, H = cv.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#1c1510'; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(zoom, 0, 0, zoom, W / 2, H / 2);
  const camX = (px - py) * TW / 2, camY = (px + py) * TH / 2;
  ctx.translate(-camX, -camY);
  const vw = W / zoom, vh = H / zoom;
  // faixa de tiles visíveis: varre diagonais s = x+y
  const sMin = Math.max(0, Math.floor((camY - vh / 2) / (TH / 2)) - 2), sMax = Math.min(GW + GH - 2, Math.ceil((camY + vh / 2) / (TH / 2)) + 14); // +14: prédios de 3 andares abaixo da tela ainda aparecem
  const pS = px + py; let playerDrawn = false;
  for (let s = sMin; s <= sMax; s++) {
    const xa = Math.max(0, s - (GH - 1)), xb = Math.min(GW - 1, s);
    // limita pelas colunas visíveis: sx = (x-y)*16 = (2x - s)*16
    const xmin = Math.max(xa, Math.ceil(((camX - vw / 2 - TW) / (TW / 2) + s) / 2)), xmax = Math.min(xb, Math.floor(((camX + vw / 2 + TW) / (TW / 2) + s) / 2));
    for (let x = xmin; x <= xmax; x++) {
      const y = s - x, t = type(x, y), sx = (x - y) * TW / 2, sy = (x + y) * TH / 2;
      if (t === 3) drawBuilding(x, y, sx, sy, hgt(x, y));
      else diamond(sx, sy, COL[t][(x + y) & 1]);
    }
    if (!playerDrawn && s >= Math.floor(pS) ) {
      PERS.draw(ctx, hero, (px - py) * TW / 2, (px + py) * TH / 2 + TH / 2); playerDrawn = true;
    }
  }
}
function labels() {
  ctx.font = '600 9px system-ui'; ctx.textAlign = 'center';
  for (const p of places) {
    if (Math.abs(p[0] - px) > 60 || Math.abs(p[1] - py) > 60) continue;
    const sx = (p[0] - p[1]) * TW / 2, sy = (p[0] + p[1]) * TH / 2 - 70;
    const w = ctx.measureText(p[2]).width + 8;
    ctx.fillStyle = 'rgba(28,21,16,.8)'; ctx.fillRect(sx - w / 2, sy - 9, w, 13);
    ctx.fillStyle = '#ffd36b'; ctx.fillText(p[2], sx, sy + 1);
  }
}
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt, now); render(); labels(); hud(dt); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
