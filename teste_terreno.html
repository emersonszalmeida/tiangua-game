<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste de terreno</title>
<style>
html,body{margin:0;height:100%;background:#1a1612;overflow:hidden;font:14px system-ui,sans-serif;color:#eee}
canvas#g{display:block;width:100vw;height:100vh;image-rendering:pixelated;cursor:crosshair}
#ui{position:fixed;left:12px;top:10px;background:rgba(0,0,0,.6);padding:8px 12px;border-radius:6px;line-height:1.6}
#ui button{font:inherit;padding:3px 10px;margin-right:4px;border-radius:4px;border:2px solid #555;background:#2a2620;color:#eee;cursor:pointer}
#ui button.on{border-color:#e8c15a;background:#4a3f25}
</style></head>
<body>
<canvas id="g"></canvas>
<div id="ui">
  <div>WASD / setas: andar · Shift: correr · roda do mouse: zoom</div>
  <div>Pintar com o mouse (arraste): <button id="bG">1 Grama</button><button id="bT">2 Terra</button> <button id="bV">V: só a camada de grama</button> <button id="bL">Limpar</button></div>
  <div style="font-size:12px;color:#bbb">A terra fica embaixo; por cima vai só a grama, com a borda calculada a partir do mapa (trilhas, pontas e ilhas funcionam). O mapa fica salvo neste navegador.</div>
</div>
<script src="sprites7.js"></script>
<script src="idles.js"></script>
<script src="personagem.js"></script>
<script src="terreno_dados.js"></script>
<script>
const N = 28;
const IMG = {}, files = []; for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) files.push('terra_' + i + '_' + j);
let pending = files.length + 1, GTD = null;
files.forEach(f => { const im = new Image(); im.onload = im.onerror = () => { if (!--pending) start(); }; im.src = 'terreno/' + f + '.png'; IMG[f] = im; });
{ const g = new Image(); g.onload = () => { const c = document.createElement('canvas'); c.width = 128; c.height = 64; const x = c.getContext('2d'); x.drawImage(g, 0, 0); GTD = x.getImageData(0, 0, 128, 64).data; IMG.grama = g; if (!--pending) start(); }; g.src = GRAMA_B64; }

let map = new Uint8Array(N * N);
if (location.search.includes('demo')) { for (let a = 10; a < 18; a++) for (let b = 10; b < 14; b++) map[a * N + b] = 1; for (let a = 10; a < 14; a++) for (let b = 14; b < 19; b++) map[a * N + b] = 1; for (let a = 15; a < 19; a++) for (let b = 12; b < 18; b++) map[a * N + b] = 1; for (let a = 3; a < 9; a++) map[a * N + 20] = 1; map[22 * N + 4] = 1; for (let a = 14; a < 24; a++) map[a * N + 19] = 1; for (let b = 19; b < 26; b++) map[23 * N + b] = 1; map[12 * N + 20] = 1; map[13 * N + 22] = 1; map[14 * N + 22] = 1; }
else try { const s = JSON.parse(localStorage.getItem('terreno_v2')); if (s && s.length === N * N) map = Uint8Array.from(s); else throw 0; } catch (e) { for (let a = 11; a < 17; a++) map[a * N + 14] = 1; for (let b = 8; b < 20; b++) map[14 * N + b] = 1; }
const get = (a, b) => (a < 0 || b < 0 || a >= N || b >= N) ? 0 : map[a * N + b];
const save = () => { try { localStorage.setItem('terreno_v2', JSON.stringify(Array.from(map))); } catch (e) {} };

// ---------- borda calculada: a terra ocupa a celula inteira; cantos arredondados (raio meia celula), por fora e por dentro ----------
const RR = 20, GN = 5 * RR, RAD = .46;                                     // grade 5x5 celulas, 20 amostras por celula
const hash = (x, y, s) => { let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const vn = (x, y, s) => { const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy); return hash(ix, iy, s) * (1 - u) * (1 - v) + hash(ix + 1, iy, s) * u * (1 - v) + hash(ix, iy + 1, s) * (1 - u) * v + hash(ix + 1, iy + 1, s) * u * v; };
const wobble = (a, b) => (vn(a * 9, b * 9, 6) - .5) * .035;
function dtSet(inSet, cap) {                                                // distancia (em celulas) ate o conjunto, limitada a cap
  const k = Math.ceil(cap * RR), offs = []; for (let dy = -k; dy <= k; dy++) for (let dx = -k; dx <= k; dx++) { const d = Math.hypot(dx, dy) / RR; if (d <= cap) offs.push([dx, dy, d]); } offs.sort((p, q) => p[2] - q[2]);
  const out = new Float32Array(GN * GN);
  for (let y = 0; y < GN; y++) for (let x = 0; x < GN; x++) { let best = cap; for (const [dx, dy, d] of offs) { if (d >= best) break; const X = x + dx, Y = y + dy; if (X >= 0 && Y >= 0 && X < GN && Y < GN && inSet[Y * GN + X]) { best = d; break; } } out[y * GN + x] = best; }
  return out; }
const FIELDS = new Map();
function fieldFor(key, flags) {   // flags[(da+2)*5+(db+2)] = 1 se for terra
  if (FIELDS.has(key)) return FIELDS.get(key);
  const E = new Uint8Array(GN * GN);
  for (let iy = 0; iy < GN; iy++) for (let ix = 0; ix < GN; ix++) { const u = -2.5 + (ix + .5) / RR, v = -2.5 + (iy + .5) / RR; let d = 99;
    for (let da = -2; da <= 2; da++) for (let db = -2; db <= 2; db++) if (!flags[(da + 2) * 5 + db + 2]) { const ex = Math.max(Math.abs(u - da) - .5, 0), ey = Math.max(Math.abs(v - db) - .5, 0); d = Math.min(d, Math.hypot(ex, ey)); }
    E[iy * GN + ix] = d >= RAD ? 1 : 0; }
  const dE = dtSet(E, 1.05), E2 = new Uint8Array(GN * GN); for (let k = 0; k < GN * GN; k++) E2[k] = dE[k] >= 2 * RAD ? 1 : 0;
  const dE2 = dtSet(E2, RAD + .3), f = new Float32Array(GN * GN); for (let k = 0; k < GN * GN; k++) f[k] = dE2[k] - RAD;
  FIELDS.set(key, f); return f; }
const sample = (f, u, v) => { const gx = Math.max(0, Math.min(GN - 1.001, (u + 2.5) * RR - .5)), gy = Math.max(0, Math.min(GN - 1.001, (v + 2.5) * RR - .5)), x0 = Math.floor(gx), y0 = Math.floor(gy), fx = gx - x0, fy = gy - y0;
  return f[y0 * GN + x0] * (1 - fx) * (1 - fy) + f[y0 * GN + x0 + 1] * fx * (1 - fy) + f[(y0 + 1) * GN + x0] * (1 - fx) * fy + f[(y0 + 1) * GN + x0 + 1] * fx * fy; };

// ---------- efeito do encontro (tufos na grama, sombra e fios na terra), em camada ----------
const hx = s => [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16)];
const BL1 = hx('#849766'), BL2 = hx('#7a8e5a'), BD = hx('#6c7f50'), SH1 = hx('#654c38'), SH2 = hx('#7e6148');
const mix = (a, b, t) => [Math.round(a[0] + (b[0] - a[0]) * t), Math.round(a[1] + (b[1] - a[1]) * t), Math.round(a[2] + (b[2] - a[2]) * t)];
const PIECES = new Map();
function pieceCanvas(A, B) {
  const flags = new Uint8Array(25); let nd = 0; for (let da = -2; da <= 2; da++) for (let db = -2; db <= 2; db++) { const v = get(A + da, B + db); flags[(da + 2) * 5 + db + 2] = v; nd += v; }
  if (nd === 0) return IMG.grama;                      // so grama em volta: peca lisa
  if (nd === 25) return null;                          // so terra em volta: nada por cima
  const key = flags.join(''), ck = A + ',' + B + ':' + key, hit = PIECES.get(ck); if (hit !== undefined) return hit;
  const f = fieldFor(key, flags), cv = document.createElement('canvas'); cv.width = 128; cv.height = 64; const cx = cv.getContext('2d'), im = cx.createImageData(128, 64), D = im.data;
  const fld = (x, y) => { const dx = (x + .5 - 64) / 64, dy = (y + .5 - 32) / 32, u = (dx + dy) / 2, v = (dx - dy) / 2; return sample(f, u, v) + wobble(A + u, B + v) > 0 ? 2 : 1; };
  let any = false;
  for (let y = 0; y < 64; y++) for (let x = 0; x < 128; x++) { const dx = (x + .5 - 64) / 64, dy = (y + .5 - 32) / 32; if (Math.abs(dx) + Math.abs(dy) >= 1) continue; const o = (y * 128 + x) * 4, m = fld(x, y), probe = (a, b) => fld(x + a, y + b);
    const col = x & 63, h0 = hash(col, 1, 91), len = 1 + Math.floor(hash(col, 2, 92) * 3);
    if (m === 1) { let c = [GTD[o], GTD[o + 1], GTD[o + 2]]; let kDn = 0; for (let k = 1; k <= 4; k++) if (probe(0, k) === 2) { kDn = k; break; }
      if (kDn && kDn <= len) { if (h0 > .45) c = kDn >= len ? BL1 : BL2; else if (h0 < .15) c = BD; } D[o] = c[0]; D[o + 1] = c[1]; D[o + 2] = c[2]; D[o + 3] = 255; any = true; }
    else { let kUp = 0; for (let k = 1; k <= 5; k++) if (probe(0, -k) === 1) { kUp = k; break; }
      if (kUp) { const w = [0, .78, .62, .44, .27, .13][kUp], s = kUp <= 2 ? mix(SH1, SH2, .45) : SH2; D[o] = s[0]; D[o + 1] = s[1]; D[o + 2] = s[2]; D[o + 3] = Math.round(w * 255); any = true; continue; }
      let kDn = 0; for (let k = 1; k <= 4; k++) if (probe(0, k) === 1) { kDn = k; break; }
      if (kDn && kDn <= len && h0 > .35) { const b = kDn === len ? BL1 : BL2; D[o] = b[0]; D[o + 1] = b[1]; D[o + 2] = b[2]; D[o + 3] = 255; any = true; } } }
  cx.putImageData(im, 0, 0); const out = any ? cv : null; PIECES.set(ck, out); return out; }

const OX = 64, OY = N * 32 + 32, FW = 2 * N * 64 + 64, FH = 2 * N * 32 + 96;
const floor = document.createElement('canvas'); floor.width = FW; floor.height = FH; const fx = floor.getContext('2d'); fx.imageSmoothingEnabled = false;
let soGrama = false;
const place = (im, A, B) => { if (im) fx.drawImage(im, OX + (A + B) * 64 - 64, OY + (A - B) * 32 - 32); };
function render() {
  fx.clearRect(0, 0, FW, FH);
  const order = []; for (let A = 0; A < N; A++) for (let B = 0; B < N; B++) order.push([A, B]); order.sort((p, q) => (p[0] - p[1]) - (q[0] - q[1]) || (p[0] + p[1]) - (q[0] + q[1]));
  if (!soGrama) for (const [A, B] of order) place(IMG['terra_' + (A % 3) + '_' + (B % 3)], A, B);
  for (const [A, B] of order) place(pieceCanvas(A, B), A, B);
}

function start() {
  const cv = document.getElementById('g'), ctx = cv.getContext('2d');
  const resize = () => { cv.width = innerWidth; cv.height = innerHeight; ctx.imageSmoothingEnabled = false; }; addEventListener('resize', resize); resize();
  const ZOOMS = [1, 2, 3]; let zi = +(new URLSearchParams(location.search).get("z") || 1); addEventListener('wheel', e => { zi = Math.max(0, Math.min(2, zi + (e.deltaY < 0 ? 1 : -1))); });
  const keys = {};
  addEventListener('keydown', e => { const k = e.key.toLowerCase(); keys[k] = true; if (e.key.startsWith('Arrow')) e.preventDefault(); if (k === '1') brush(0); if (k === '2') brush(1); if (k === 'v') toggleV(); });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; }); addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  let paint = 1; const bG = document.getElementById('bG'), bT = document.getElementById('bT'), bV = document.getElementById('bV');
  function brush(v) { paint = v; bG.classList.toggle('on', v === 0); bT.classList.toggle('on', v === 1); } brush(1);
  function toggleV() { soGrama = !soGrama; bV.classList.toggle('on', soGrama); render(); }
  bG.onclick = () => brush(0); bT.onclick = () => brush(1); bV.onclick = toggleV;
  document.getElementById('bL').onclick = () => { map.fill(0); save(); render(); };
  render();

  const hero = PERS.create('SE'); const QP = new URLSearchParams(location.search); let pa = +(QP.get("pa") || 14), pb = +(QP.get("pb") || 14);
  const WALK = 160 / 3, RUN = 300 / 3;
  let cam = { x: 0, y: 0 }, down = false;
  const cellAt = e => { const z = ZOOMS[zi], wx = (e.clientX - (cv.width / 2 - cam.x * z)) / z, wy = (e.clientY - (cv.height * .55 - cam.y * z)) / z; return [Math.round((wx / 64 + wy / 32) / 2), Math.round((wx / 64 - wy / 32) / 2)]; };
  function paintAt(e) { const [A, B] = cellAt(e); if (A < 0 || B < 0 || A >= N || B >= N || map[A * N + B] === paint) return; map[A * N + B] = paint; save(); render(); }
  cv.addEventListener('pointerdown', e => { down = true; paintAt(e); }); addEventListener('pointerup', () => down = false); cv.addEventListener('pointermove', e => { if (down) paintAt(e); });

  let last = performance.now();
  (function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    const kx = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0), ky = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
    PERS.step(hero, kx, ky, !!keys.shift, now);
    if (hero.moving) { const l = Math.hypot(kx, ky), d = (hero.run ? RUN : WALK) * dt, dx = kx / l * d, dy = ky / l * d;
      pa = Math.max(-.4, Math.min(N - .6, pa + (dx / 64 + dy / 32) / 2)); pb = Math.max(-.4, Math.min(N - .6, pb + (dx / 64 - dy / 32) / 2)); }
    const sx = (pa + pb) * 64, sy = (pa - pb) * 32; cam.x = sx; cam.y = sy;
    const z = ZOOMS[zi], Wd = cv.width, Hd = cv.height;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#1a1612'; ctx.fillRect(0, 0, Wd, Hd);
    ctx.setTransform(z, 0, 0, z, Math.round(Wd / 2 - sx * z), Math.round(Hd * .55 - sy * z));
    ctx.drawImage(floor, -OX, -OY);
    PERS.draw(ctx, hero, sx, sy);
    requestAnimationFrame(loop);
  })(last);
}
</script></body></html>
