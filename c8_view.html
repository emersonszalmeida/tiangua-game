<!doctype html><html><head><meta charset="utf-8"><title>c8</title><style>body{margin:0;background:#202020;color:#eee;font:13px system-ui;padding:10px;display:flex;gap:14px;align-items:flex-start}.c{background:#8c8c8c;color:#111;padding:6px;text-align:center;border-radius:4px}canvas,img{image-rendering:pixelated;display:block}</style></head><body>
<script src="sprites7.js"></script><script>
const items=[['S quadro 1','frames8/f01.png','c8_f01.json'],['E quadro 16','frames8/f16.png','c8_f16.json'],['N quadro 28','frames8/f28.png','c8_f28.json']];
(async()=>{for(const [t,img,js] of items){const d=document.createElement('div');d.className='c';const i=new Image();i.src=img;i.style.height='200px';d.appendChild(i);d.append(t+' (original)');document.body.appendChild(d);
const j=await (await fetch(js)).json();const c=document.createElement('canvas'),k=3;c.width=j.w*k;c.height=j.h*k;const x=c.getContext('2d');j.rows.forEach((r,y)=>{for(let i2=0;i2<r.length;i2++)if(r[i2]!=='.'){x.fillStyle=SPR7.pal[r[i2]];x.fillRect(i2*k,y*k,k,k)}});const e=document.createElement('div');e.className='c';e.appendChild(c);e.append(t+' convertido '+j.w+'x'+j.h);document.body.appendChild(e)}})();
</script></body></html>
