<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>NW parado</title>
<style>body{margin:0;background:#202020;color:#eee;font:14px system-ui;padding:14px}.g{display:flex;gap:14px;flex-wrap:wrap}.c{background:#8c8c8c;padding:8px;text-align:center;color:#111;border-radius:6px}canvas{image-rendering:pixelated;display:block}</style></head>
<body><div class="g" id="a"></div>
<script src="sprites7.js"></script><script src="idle_nw.js"></script><script>
function mk(rows,pal,k,flip){const w=rows[0].length,c=document.createElement('canvas');c.width=w*k;c.height=rows.length*k;const x=c.getContext('2d');if(flip){x.translate(c.width,0);x.scale(-1,1)}rows.forEach((r,y)=>{for(let i=0;i<r.length;i++)if(r[i]!=='.'){x.fillStyle=pal[r[i]];x.fillRect(i*k,y*k,k,k)}});return c}
const add=(c,t)=>{const d=document.createElement('div');d.className='c';d.appendChild(c);d.append(t);document.getElementById('a').appendChild(d)};
add(mk(SPR7.slots.walkNW.frames[0],SPR7.pal,6),'Antes (quadro 0 do andar)');
add(mk(IDLE_NW.rows,IDLE_NW.pal,6),'NW parado (novo)');
add(mk(IDLE_NW.rows,IDLE_NW.pal,6,true),'NE parado (espelhado)');
</script></body></html>
