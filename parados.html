<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Posições do personagem parado</title>
<style>
body{margin:0;background:#202020;color:#eee;font:15px system-ui,sans-serif;padding:16px}
h2{margin:22px 0 8px}
.g{display:flex;flex-wrap:wrap;gap:10px}
.c{background:#333;border-radius:6px;padding:6px;text-align:center}
.c img{display:block;image-rendering:pixelated;height:220px}
.c.ok{outline:2px solid #4c8}.c.no{outline:2px solid #c84}
small{display:block;margin-top:4px;color:#bbb}
.k{height:150px!important}
</style></head><body>
<h1>Personagem parado — o que existe nos dois arquivos</h1>
<p>Verde = parado de verdade (pernas juntas, braços caídos). Laranja = só aparece andando ou em passo, não serve como parado.</p>
<h2>Parados encontrados</h2><div class="g" id="a"></div>
<h2>Falta: costas em 3/4 (NE / NW)</h2><div class="g" id="b"></div>
<h2>Todos os 56 quadros do banheiro (para você conferir)</h2><div class="g" id="c"></div>
<script>
const card=(src,t,sub,cls)=>`<div class="c ${cls||''}"><img src="frames8/${src}.png"><b>${t}</b><small>${sub}</small></div>`;
const f=n=>'f'+String(n).padStart(2,'0');
document.getElementById('a').innerHTML=
 [[f(1),'Frente (S)','quadro 1','ok'],['cozinha','Frente-direita (SE); espelhada vira SW','foto da cozinha','ok'],[f(16),'Perfil (E; espelhada vira W)','quadro 16','ok'],[f(17),'Perfil (E; espelhada vira W)','quadro 17 (igual ao 16)','ok'],[f(28),'Costas (N)','quadro 28','ok']].map(a=>card(...a)).join('');
document.getElementById('b').innerHTML=[19,20,21,22,23].map(n=>card(f(n),'Costas 3/4 andando','quadro '+n,'no')).join('');
document.getElementById('c').innerHTML=Array.from({length:56},(_,i)=>`<div class="c"><img class="k" src="frames8/${f(i)}.png"><small>${i}</small></div>`).join('');
</script></body></html>
