<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor da cabana</title>
<style>
html,body{margin:0;height:100%;background:#1a1612;overflow:hidden;color:#eee;font:13px system-ui,sans-serif}
canvas{position:fixed;inset:0;image-rendering:pixelated}
#ui{position:fixed;left:10px;top:8px;background:rgba(20,16,12,.75);padding:6px 10px;border-radius:6px;line-height:1.5}
#ui b{color:#ffd76a}
#painel{position:fixed;right:10px;top:8px;width:230px;max-height:calc(100% - 20px);overflow:auto;background:rgba(20,16,12,.85);padding:8px;border-radius:6px}
#painel h4{margin:8px 0 4px;font-size:12px;color:#ffd76a;font-weight:600}
#painel .g{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
#painel button{background:#3a3028;color:#eee;border:2px solid transparent;border-radius:4px;padding:3px;cursor:pointer;font:11px system-ui;min-height:34px}
#painel button img{display:block;margin:0 auto 2px;image-rendering:pixelated;max-width:100%;height:30px;object-fit:contain}
#painel button.on{border-color:#ffd76a;background:#5a4630}
#painel .acoes{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px}
#msg{margin-top:6px;font-size:12px;color:#9fd}
</style></head>
<body>
<canvas id="g"></canvas>
<div id="ui"></div>
<div id="painel"></div>
<script src="sprites7.js"></script><script src="idles.js"></script><script src="personagem.js"></script><script src="chao.js"></script><script src="chao_lib.js"></script><script src="terreno_dados.js"></script>
<script>
// materiais novos (camada propria em terreno_motor.js): ficam no fim da lista; nunca invadem nem sao invadidos pelas transicoes antigas
MATS.grama_baixa = { prio: 98, prim: 'grama_normal', borda: 0, nome: 'Grama', icone: 'terreno/grama_base_128x64.png' };
MATS.terra_nova = { prio: 99, prim: 'terra_lisa', borda: 0, nome: 'Terra', icone: 'terreno/terra_0_0.png' };
</script>
<script src="terreno_motor.js"></script>
<script>
// ---------- texturas ----------
const N = CHAO.n, PAL = CHAO.pal.map(h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)));
const TEX = {}; for (const nm of CHAO.nomes) { const s = CHAO.tex[nm], a = new Uint8Array(N * N * 3); for (let k = 0; k < N * N; k++) { const c = PAL[s.charCodeAt(k) - 65]; a[k * 3] = c[0]; a[k * 3 + 1] = c[1]; a[k * 3 + 2] = c[2]; } TEX[nm] = a; }
// ---------- ruído (só para sortear o mapa inicial) ----------
const hash = (i, j, s) => hz(i, j, s);
const sm = t => t * t * (3 - 2 * t);
function vn(x, y, s) { const i = Math.floor(x), j = Math.floor(y), fx = sm(x - i), fy = sm(y - j); return (hash(i, j, s) * (1 - fx) + hash(i + 1, j, s) * fx) * (1 - fy) + (hash(i, j + 1, s) * (1 - fx) + hash(i + 1, j + 1, s) * fx) * fy; }
const fbm = (x, y, s) => vn(x, y, s) * .6 + vn(x * 2.1, y * 2.1, s + 7) * .3 + vn(x * 4.3, y * 4.3, s + 13) * .1;
// ---------- mapa: grade de 24×24 tiles, cada um com UM material ----------
const M = 24, NOMES = Object.keys(MATS);
const PATH = [[2, 22], [5, 18], [8, 14.5], [11, 11.5], [14, 9.5]];
function distPath(x, y) { let best = 1e9; for (let i = 0; i < PATH.length - 1; i++) { const [ax, ay] = PATH[i], [bx, by] = PATH[i + 1], dx = bx - ax, dy = by - ay, t = Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy))); best = Math.min(best, Math.hypot(x - ax - dx * t, y - ay - dy * t)); } return best; }
function materialInicial(cx, cy) {
  const x = cx + .5, y = cy + .5, X = x + (fbm(x * .8, y * .8, 3) - .5) * 1.4, Y = y + (fbm(x * .8, y * .8, 4) - .5) * 1.4, n = fbm(x * 1.3, y * 1.3, 5);
  if (cx >= 14 && cx <= 20 && cy >= 3 && cy <= 7) return 'madeira';
  if (Math.hypot(X - 8, Y - 6) < 2.6) return 'cascalho';
  if (Math.hypot(X - 5, Y - 10.5) < 2.9) return 'lama';
  if (X + Y > 34 + (n - .5) * 4) return 'floresta';
  if (distPath(X, Y) < 1.0 + (n - .5) * .5) return 'terra';
  return 'grama';
}
const MAP = Array.from({ length: M }, (_, cy) => Array.from({ length: M }, (_, cx) => 'grama_baixa'));
// variações de textura de cada material (sorteadas por tile, sempre as mesmas)
const VARS = {
  grama: ['grama_normal', 'grama_normal', 'grama_normal', 'grama_normal', 'grama_normal_b', 'grama_normal_b', 'grama_normal_b', 'grama_flores', 'grama_flores', 'grama_folhas'],
  terra: ['terra_lisa', 'terra_lisa', 'terra_lisa', 'terra_lisa', 'terra_lisa', 'terra_lisa', 'terra_pedras'],
  floresta: ['floresta_folhas', 'floresta_folhas', 'floresta_agulhas', 'floresta_agulhas', 'floresta_musgo', 'floresta_cogumelos'],
  lama: ['lama_umida', 'lama_umida', 'lama_umida', 'lama_umida', 'lama_umida', 'lama_umida', 'lama_umida', 'lama_umida', 'lama_umida', 'pocas'],
  cascalho: ['cascalho', 'cascalho', 'cascalho', 'cascalho', 'cascalho', 'cascalho', 'cascalho', 'pedras'],
  madeira: ['madeira_clara'],
  grama_baixa: ['grama_normal'], terra_nova: ['terra_lisa'],   // so a base; o desenho de verdade vem da camada do terreno
};
const matDe = (cx, cy) => (cx < 0 || cy < 0 || cx >= M || cy >= M) ? null : MAP[cy][cx];
function texDe(cx, cy) {
  const m = MAP[cy][cx];
  if (m === 'madeira') return matDe(cx, cy + 1) === 'madeira' ? 'madeira_clara' : 'madeira_escura';   // faixa da frente = degrau
  const v = VARS[m]; return v[Math.floor(hash(cx, cy, 9) * v.length)];
}
// peças de transição que cada tile recebe: [{ mat, peça }] em ordem de prioridade
const OV = new Array(M * M);
function calcOv(cx, cy) {
  const own = MAP[cy][cx], pr = MATS[own].prio, achados = {};
  VIZ.forEach(([dx, dy], k) => { const m = matDe(cx + dx, cy + dy); if (m && m !== own && MATS[m].borda && MATS[m].prio > pr) achados[m] = (achados[m] || 0) | (1 << k); });
  OV[cy * M + cx] = Object.keys(achados).sort((a, b) => MATS[a].prio - MATS[b].prio).map(m => ({ m, p: pieceFor(normMask(achados[m])) }));
}
for (let cy = 0; cy < M; cy++) for (let cx = 0; cx < M; cx++) calcOv(cx, cy);
// ---------- desenha o chão por pixel (1 tile = 128×64) ----------
const GW = (M + M) * 64, GH = (M + M) * 32, ground = document.createElement('canvas'); ground.width = GW; ground.height = GH;
const gctx = ground.getContext('2d'), gd = gctx.createImageData(GW, GH), D = gd.data;
function renderCells(x0, y0, x1, y1) {
  x0 = Math.max(0, x0); y0 = Math.max(0, y0); x1 = Math.min(M - 1, x1); y1 = Math.min(M - 1, y1);
  const sx0 = M * 64 + (x0 - y1 - 1) * 64, sx1 = M * 64 + (x1 + 1 - y0) * 64, sy0 = (x0 + y0) * 32, sy1 = (x1 + y1 + 2) * 32;
  for (let sy = sy0; sy < sy1; sy++) for (let sx = sx0; sx < sx1; sx++) {
    const px = sx - M * 64, x = (px / 64 + (sy + .5) / 32) / 2, y = ((sy + .5) / 32 - px / 64) / 2, cx = Math.floor(x), cy = Math.floor(y);
    if (cx < x0 || cx > x1 || cy < y0 || cy > y1) continue;
    const u = Math.floor((x - cx) * N), v = Math.floor((y - cy) * N), k = (v * N + u) * 3, o = (sy * GW + sx) * 4; let t = TEX[texDe(cx, cy)], r = t[k], g = t[k + 1], b = t[k + 2];
    for (const ov of OV[cy * M + cx]) { const c = ov.p[v * N + u]; if (!c) continue; const tt = TEX[MATS[ov.m].prim], f = c === 2 ? .55 : 1; r = tt[k] * f; g = tt[k + 1] * f; b = tt[k + 2] * f; }
    D[o] = r; D[o + 1] = g; D[o + 2] = b; D[o + 3] = 255;
  }
  gctx.putImageData(gd, 0, 0, sx0, sy0, sx1 - sx0, sy1 - sy0);
}
renderCells(0, 0, M - 1, M - 1);
function pinta(cx, cy, m) {
  if (cx < 0 || cy < 0 || cx >= M || cy >= M || MAP[cy][cx] === m) return; MAP[cy][cx] = m;
  for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) if (matDe(cx + i, cy + j)) calcOv(cx + i, cy + j);
  renderCells(cx - 1, cy - 1, cx + 1, cy + 1); TERR.render();
}
// ---------- objetos (árvores) ----------
const OBJS = { arvore1: { nome: 'Árvore 1', src: 'arvore_v3_sem_galho.png', cx: 64, by: 103 }, arvore2: { nome: 'Árvore 2', src: 'arvore_pl0.png', cx: 63, by: 90 }, arvore3: { nome: 'Árvore 3', src: 'arvore_v1_sem_galho.png', cx: 63, by: 106 }, arvore4: { nome: 'Árvore 1 espelhada', src: 'arvore_v3_sem_galho.png', cx: 64, by: 103, flip: true } };
for (const o of Object.values(OBJS)) { o.im = new Image(); o.im.src = o.src; }
let objetos = [];   // { x, y, id } — x,y = célula inteira
const objEm = (cx, cy) => objetos.findIndex(o => o.x === cx && o.y === cy);
function desenhaObj(c, o, sx, sy) { const d = OBJS[o.id]; if (!d.im.complete || !d.im.naturalWidth) return; c.save(); c.translate(sx, sy + 4 - d.by * 2); if (d.flip) c.scale(-1, 1); c.imageSmoothingEnabled = false; c.drawImage(d.im, -d.cx * 2, 0, 256, 256); c.restore(); }
// ---------- salvar / abrir ----------
function paraJson() { return { versao: 1, tamanho: M, materiais: NOMES, chao: MAP.map(r => r.map(m => NOMES.indexOf(m)).join('')), objetos, }; }
function deJson(j) {
  if (!j || j.tamanho !== M || !Array.isArray(j.chao)) throw new Error('arquivo de mapa inválido');
  const mats = j.materiais; for (let y = 0; y < M; y++) for (let x = 0; x < M; x++) { const m = mats[+j.chao[y][x]]; MAP[y][x] = MATS[m] ? m : 'grama_baixa'; }
  objetos = (j.objetos || []).filter(o => OBJS[o.id] && o.x >= 0 && o.y >= 0 && o.x < M && o.y < M);
  for (let cy = 0; cy < M; cy++) for (let cx = 0; cx < M; cx++) calcOv(cx, cy); renderCells(0, 0, M - 1, M - 1); TERR.render();
}
const msg = t => { const e = document.getElementById('msg'); if (e) e.textContent = t; };
function autosave() { try { localStorage.setItem('cabana_mapa_v2', JSON.stringify(paraJson())); } catch (e) { } }
function baixa() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(paraJson())], { type: 'application/json' })); a.download = 'mapa.json'; a.click(); msg('mapa.json salvo na pasta Downloads'); }
function abre(f) { const r = new FileReader(); r.onload = () => { try { deJson(JSON.parse(r.result)); autosave(); msg('mapa aberto'); } catch (e) { msg('erro: ' + e.message); } }; r.readAsText(f); }
if (!new URLSearchParams(location.search).has('novo')) try { const salvo = localStorage.getItem('cabana_mapa_v2'); if (salvo) deJson(JSON.parse(salvo)); } catch (e) { }
if (new URLSearchParams(location.search).has('demot')) {   // exemplo do terreno novo: ?demot&x=12&y=12
  for (let cy = 4; cy < 20; cy++) for (let cx = 4; cx < 20; cx++) MAP[cy][cx] = 'grama_baixa';
  for (let cx = 6; cx < 19; cx++) MAP[12][cx] = 'terra_nova';
  for (let cy = 12; cy < 18; cy++) MAP[cy][14] = 'terra_nova';
  for (let cy = 7; cy < 11; cy++) for (let cx = 8; cx < 12; cx++) MAP[cy][cx] = 'terra_nova';
  MAP[16][8] = 'terra_nova'; MAP[15][18] = 'terra_nova'; MAP[15][17] = 'terra_nova';
  for (let cy = 0; cy < M; cy++) for (let cx = 0; cx < M; cx++) calcOv(cx, cy); renderCells(0, 0, M - 1, M - 1); TERR.render();
}
// ---------- jogo ----------
const cv = document.getElementById('g'), ctx = cv.getContext('2d'), ui = document.getElementById('ui'); let K = 2, grade = false, ferr = { t: 'chao', id: 'terra_nova' }, editar = true, hsx = 0, hsy = 0, apertado = false;
const resize = () => { cv.width = innerWidth; cv.height = innerHeight; ctx.imageSmoothingEnabled = false; }; addEventListener('resize', resize); resize();
const VISIVEIS = ['grama_baixa', 'terra_nova'];
let larg = 1, inicio = null, snap = null;   // pincel (1x1, 2x2, 3x3), inicio do traco e copia do mapa para a linha reta
const atualizaUi = () => {
  ui.innerHTML = 'WASD / setas: andar · Shift: correr · roda: zoom · T: grade · E: mostra/esconde o editor';
  const pn = document.getElementById('painel'); pn.style.display = editar ? '' : 'none'; if (!editar) return;
  const bt = (t, id, img, nome) => '<button data-t="' + t + '" data-id="' + id + '" class="' + (ferr.t === t && ferr.id === id ? 'on' : '') + '"><img src="' + img + '">' + nome + '</button>';
  pn.innerHTML = '<h4>Chão (teclas 1 e 2)</h4><div class="g">' + VISIVEIS.map(m => bt('chao', m, MATS[m].icone || 'chao_tiles/base_' + MATS[m].prim + '.png', MATS[m].nome || m)).join('') + '</div>' +
    '<h4>' + 'Pincel · Shift + arrastar = linha reta' + '</h4><div class="g">' + [1, 2, 3].map(w => '<button data-w="' + w + '" class="' + (larg === w ? 'on' : '') + '">' + w + '×' + w + '</button>').join('') + '</div>' +
    '<h4>Objetos</h4><div class="g">' + Object.entries(OBJS).map(([id, o]) => bt('obj', id, o.src, o.nome)).join('') + bt('apagar', 'x', 'chao_tiles/base_laje.png', 'Apagar objeto') + '</div>' +
    '<div class="acoes"><button id="bSalvar">Salvar</button><button id="bAbrir">Abrir</button></div><input type="file" id="fArq" accept=".json" style="display:none"><div id="msg"></div>' +
    '<div style="margin-top:6px;font-size:11px;color:#bbb">Clique ou arraste para pintar. Botão direito apaga um objeto. O mapa também fica guardado sozinho neste navegador.</div>';
  pn.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { larg = +b.dataset.w; atualizaUi(); });
  pn.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { ferr = { t: b.dataset.t, id: b.dataset.id }; atualizaUi(); });
  document.getElementById('bSalvar').onclick = baixa; document.getElementById('bAbrir').onclick = () => document.getElementById('fArq').click(); document.getElementById('fArq').onchange = e => e.target.files[0] && abre(e.target.files[0]);
}; atualizaUi();
addEventListener('wheel', e => { K = Math.max(1, Math.min(4, K + (e.deltaY < 0 ? 1 : -1))); });
const keys = {}; addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyT') grade = !grade; if (e.code === 'KeyE') { editar = !editar; atualizaUi(); } const n = +e.key; if (n >= 1 && n <= VISIVEIS.length) { ferr = { t: 'chao', id: VISIVEIS[n - 1] }; atualizaUi(); } }); addEventListener('keyup', e => keys[e.code] = false);
function pintaMouse(e) {
  if (!editar) return; const gx = (e.clientX - cv.width / 2) / K + hsx - M * 64, gy = (e.clientY - cv.height / 2) / K + hsy, cx = Math.floor((gx / 64 + gy / 32) / 2), cy = Math.floor((gy / 32 - gx / 64) / 2);
  if (cx < 0 || cy < 0 || cx >= M || cy >= M) return; const i = objEm(cx, cy);
  if (e.button === 2 || ferr.t === 'apagar') { if (i >= 0) { objetos.splice(i, 1); autosave(); } return; }
  if (ferr.t === 'chao') {
    const carimba = (x, y) => { const o = Math.floor((larg - 1) / 2); for (let j = 0; j < larg; j++) for (let k = 0; k < larg; k++) pinta(x - o + k, y - o + j, ferr.id); };
    if (e.type === 'pointerdown') { inicio = [cx, cy]; snap = MAP.map(r => r.slice()); }
    if (e.shiftKey && inicio) {   // linha reta ao longo do eixo da grade mais proximo da direcao do mouse
      for (let y = 0; y < M; y++) for (let x = 0; x < M; x++) if (MAP[y][x] !== snap[y][x]) pinta(x, y, snap[y][x]);
      const dx = cx - inicio[0], dy = cy - inicio[1], n = Math.max(Math.abs(dx), Math.abs(dy)), sx = Math.abs(dx) >= Math.abs(dy) ? Math.sign(dx) : 0, sy = sx ? 0 : Math.sign(dy);
      for (let t = 0; t <= n; t++) carimba(inicio[0] + sx * t, inicio[1] + sy * t);
    } else carimba(cx, cy);
    autosave(); } else if (ferr.t === 'obj') { if (i >= 0) objetos.splice(i, 1); objetos.push({ x: cx, y: cy, id: ferr.id }); autosave(); }
}
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => { apertado = true; pintaMouse(e); }); addEventListener('pointerup', () => { apertado = false; }); cv.addEventListener('pointermove', e => { if (apertado) pintaMouse(e); });
const P = PERS.create('NE'); let hx = M / 2 + .5, hy = M / 2 + .5, last = performance.now();
const q = new URLSearchParams(location.search); if (q.has('x')) hx = +q.get('x'); if (q.has('y')) hy = +q.get('y'); if (q.has('z')) K = +q.get('z');
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const dx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0), dy = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0), run = keys.ShiftLeft || keys.ShiftRight;
  PERS.step(P, dx, dy, run, now);
  if (dx || dy) { const v = (run ? 190 : 110) * dt; // pixels de tela
    const sxv = dx / Math.hypot(dx, dy) * v, syv = dy / Math.hypot(dx, dy) * v * .5;
    const nx = hx + (sxv / 64 + syv / 32) / 2, ny = hy + (syv / 32 - sxv / 64) / 2; const livre = (x, y) => x > .3 && y > .3 && x < M - .3 && y < M - .3 && objEm(Math.floor(x), Math.floor(y)) < 0; if (livre(nx, ny)) { hx = nx; hy = ny; } else if (livre(nx, hy)) hx = nx; else if (livre(hx, ny)) hy = ny; }
  hsx = (hx - hy) * 64 + M * 64; hsy = (hx + hy) * 32; const cx = cv.width / 2, cy = cv.height / 2;
  ctx.fillStyle = '#16120e'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.save(); ctx.imageSmoothingEnabled = false; ctx.translate(Math.round(cx - hsx * K), Math.round(cy - hsy * K)); ctx.scale(K, K);
  ctx.drawImage(ground, 0, 0); if (TERR.cv) ctx.drawImage(TERR.cv, 0, 0);
  if (grade) { ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1 / K; ctx.beginPath(); for (let i = 0; i <= M; i++) { ctx.moveTo(M * 64 + i * 64, i * 32); ctx.lineTo(M * 64 + i * 64 - M * 64, i * 32 + M * 32); ctx.moveTo(M * 64 - i * 64, i * 32); ctx.lineTo(M * 64 - i * 64 + M * 64, i * 32 + M * 32); } ctx.stroke(); }
  const lista = objetos.map(o => ({ d: o.x + o.y + 1, f: () => desenhaObj(ctx, o, Math.round((o.x - o.y) * 64 + M * 64), Math.round((o.x + o.y + 1) * 32)) }));
  lista.push({ d: hx + hy, f: () => PERS.draw(ctx, P, hsx, hsy) }); lista.sort((a, b) => a.d - b.d).forEach(it => it.f()); ctx.restore(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
