<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor da cabana</title>
<style>
html,body{margin:0;height:100%;background:#1a1612;overflow:hidden;color:#eee;font:13px system-ui,sans-serif}
canvas{position:fixed;inset:0;image-rendering:pixelated}
#ui{position:fixed;left:10px;top:8px;background:rgba(20,16,12,.75);padding:6px 10px;border-radius:6px;line-height:1.5}
#ui b{color:#ffd76a}
#painel{position:fixed;right:10px;top:8px;width:230px;max-height:calc(100% - 20px);overflow:auto;background:rgba(20,16,12,.85);padding:8px;border-radius:6px}
#painel h4{margin:8px 0 4px;font-size:12px;color:#ffd76a;font-weight:600}
#painel .g{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
#painel button{background:#3a3028;color:#eee;border:2px solid transparent;border-radius:4px;padding:3px;cursor:pointer;font:11px system-ui;min-height:34px}
#painel button img{display:block;margin:0 auto 2px;image-rendering:pixelated;max-width:100%;height:30px;object-fit:contain}
#painel button.on{border-color:#ffd76a;background:#5a4630}
#painel .acoes{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px}
#msg{margin-top:6px;font-size:12px;color:#9fd}
</style></head>
<body>
<canvas id="g"></canvas>
<div id="ui"></div>
<div id="painel"></div>
<script src="sprites7.js"></script><script src="idles.js"></script><script src="personagem.js"></script><script src="terreno_dados.js"></script><script src="decoracao_dados.js"></script><script src="arvore_dados.js"></script>
<script>
const MATS = {
  grama_baixa: { nome: 'Grama', icone: 'terreno/grama_base_128x64.png' },
  terra_nova: { nome: 'Terra', icone: 'terreno/terra_0_0.png' },
};
</script>
<script src="terreno_motor.js"></script>
<script>
const M = 24, NOMES = Object.keys(MATS);
const MAP = Array.from({ length: M }, (_, cy) => Array.from({ length: M }, (_, cx) => 'grama_baixa'));
function pinta(cx, cy, m) {
  if (cx < 0 || cy < 0 || cx >= M || cy >= M || MAP[cy][cx] === m) return; MAP[cy][cx] = m; TERR.render();
}
const matDe = (cx, cy) => (cx < 0 || cy < 0 || cx >= M || cy >= M) ? null : MAP[cy][cx];
// ---------- objetos (árvores) ----------
const OBJS = { arvore1: { nome: 'Árvore 1', src: 'arvore_v3_sem_galho.png', cx: 64, by: 103 }, arvore2: { nome: 'Árvore 2', src: 'arvore_pl0.png', cx: 63, by: 90 }, arvore3: { nome: 'Árvore 3', src: 'arvore_v1_sem_galho.png', cx: 63, by: 106 }, arvore4: { nome: 'Árvore 1 espelhada', src: 'arvore_v3_sem_galho.png', cx: 64, by: 103, flip: true } };
const DECOS = [['grama_alta_1', 'Grama alta 1'], ['grama_alta_2', 'Grama alta 2'], ['grama_alta_3', 'Grama alta 3'], ['grama_alta_4', 'Grama alta 4'], ['grama_media_1', 'Grama média 1'], ['grama_media_2', 'Grama média 2'], ['grama_baixa_1', 'Grama baixa 1'], ['grama_baixa_2', 'Grama baixa 2'], ['flor_margarida', 'Margarida'], ['flor_amarela', 'Flor amarela'], ['flor_lavanda', 'Lavanda'], ['flor_papoula', 'Papoula'], ['flor_papoula_b', 'Papoula 2'], ['flor_azul', 'Flor azul'], ['flor_azul_b', 'Flor azul 2'], ['flor_mista', 'Flores mistas'], ['pedra_mini', 'Pedrinha'], ['pedra_pequena', 'Pedra pequena'], ['pedra_grande', 'Pedra grande'], ['pedra_dupla', 'Pedras juntas'], ['pedra_chata', 'Pedra chata'], ['pedra_trio', 'Três pedras'], ['cogumelo_1', 'Cogumelo marrom'], ['cogumelo_2', 'Cogumelo vermelho'], ['cogumelo_3', 'Marrons juntos'], ['cogumelo_4', 'Cogumelo bege'], ['cogumelo_5', 'Vermelhos juntos'], ['cogumelo_6', 'Marrom grande'], ['cogumelo_7', 'Vermelho grande'], ['cogumelo_8', 'Marrons grandes'], ['cogumelo_9', 'Bege grande'], ['cogumelo_10', 'Vermelhos grandes'], ['folha_1', 'Folha seca'], ['folhas_monte', 'Folhas secas'], ['galho', 'Galho'], ['trevo', 'Trevos']];
for (const [id, a] of Object.entries(ARV_DADOS)) OBJS[(a.tipo === 'deco' ? 'd_' : 'n_') + id] = a.tipo === 'deco' ? { nome: a.nome, src: a.src, deco: true, pe: a.pe } : { nome: a.nome, src: a.src, cx: a.cx, by: a.by, esc: a.esc, raio: a.raio, ox: a.ox, oy: a.oy, pe: a.pe };   // árvores/arbustos novos (arvores_do_gemini.mjs)
for (const [id, nome] of DECOS) OBJS['d_' + id] = { nome, src: DECO_B64[id], deco: true };
for (const o of Object.values(OBJS)) { o.im = new Image(); o.im.src = o.src; }
let objetos = [];   // árvores: { x, y, id } com x,y = célula inteira · decorações: { x, y, id, f: 1 } com x,y = posição livre dentro do mapa (várias por célula, não bloqueiam)
const ESCD = 1;   // escala das decorações (as árvores e o personagem usam 2)
const MASK = {};
function maskDe(id) { if (MASK[id]) return MASK[id]; const im = OBJS[id].im; if (!im.complete || !im.naturalWidth) return null; const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight; const x = c.getContext('2d'); x.drawImage(im, 0, 0); const d = x.getImageData(0, 0, c.width, c.height).data, a = new Uint8Array(c.width * c.height); for (let i = 0; i < a.length; i++) a[i] = d[i * 4 + 3] ? 1 : 0; return MASK[id] = { w: c.width, h: c.height, a }; }
// o ponto do mundo (wx, wy, relativo ao mapa) cai num pixel desenhado da decoração o?
function opaco(o, wx, wy, tol = 0) { const m = maskDe(o.id); if (!m) return false; const px = Math.floor((wx - (o.x - o.y) * 64) / ESCD + m.w / 2), py = Math.floor((wy - (o.x + o.y) * 32) / ESCD + (m.h - 1));
  for (let j = -tol; j <= tol; j++) for (let i = -tol; i <= tol; i++) { const x = px + i, y = py + j; if (x >= 0 && y >= 0 && x < m.w && y < m.h && m.a[y * m.w + x]) return true; } return false; }
// uma decoração nova em (fx, fy) encostaria nos pixels de alguma que já existe?
function sobrepoe(id, fx, fy) { const m = maskDe(id); if (!m) return false; const bx = (fx - fy) * 64, by = (fx + fy) * 32, viz = objetos.filter(o => OBJS[o.id].deco && Math.abs((o.x - o.y) * 64 - bx) < 60 && Math.abs((o.x + o.y) * 32 - by) < 70);
  if (!viz.length) return false; for (let j = 0; j < m.h; j++) for (let i = 0; i < m.w; i++) if (m.a[j * m.w + i]) { const wx = bx + (i - m.w / 2 + .5) * ESCD, wy = by + (j - (m.h - 1) + .5) * ESCD; for (const o of viz) if (opaco(o, wx, wy)) return true; } return false; }
const objEm = (cx, cy) => objetos.findIndex(o => !OBJS[o.id].deco && o.x === cx && o.y === cy);
function desenhaObj(c, o, sx, sy) { const d = OBJS[o.id]; if (!d.im.complete || !d.im.naturalWidth) return; c.save(); const nw = d.im.naturalWidth, nh = d.im.naturalHeight, cx0 = d.deco ? nw / 2 : d.cx, by0 = d.deco ? nh - 1 : d.by; const ESC = d.deco ? ESCD : (d.esc || 2); c.translate(sx, sy + (d.deco ? 0 : 4) - by0 * ESC); if (d.flip) c.scale(-1, 1); c.imageSmoothingEnabled = false; c.drawImage(d.im, -cx0 * ESC, 0, nw * ESC, nh * ESC); c.restore(); }
// ---------- salvar / abrir ----------
function paraJson() { return { versao: 1, tamanho: M, materiais: NOMES, chao: MAP.map(r => r.map(m => NOMES.indexOf(m)).join('')), objetos, }; }
function deJson(j) {
  if (!j || j.tamanho !== M || !Array.isArray(j.chao)) throw new Error('arquivo de mapa inválido');
  const mats = j.materiais; for (let y = 0; y < M; y++) for (let x = 0; x < M; x++) { const m = mats[+j.chao[y][x]]; MAP[y][x] = MATS[m] ? m : 'grama_baixa'; }
  objetos = (j.objetos || []).filter(o => OBJS[o.id] && o.x >= 0 && o.y >= 0 && o.x < M && o.y < M); objetos.forEach(o => { if (OBJS[o.id].deco && !o.f) { o.x += .5; o.y += .5; o.f = 1; } });
  TERR.render();
}
const msg = t => { const e = document.getElementById('msg'); if (e) e.textContent = t; };
function autosave() { try { localStorage.setItem('cabana_mapa_v2', JSON.stringify(paraJson())); } catch (e) { } }
function baixa() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(paraJson())], { type: 'application/json' })); a.download = 'mapa.json'; a.click(); msg('mapa.json salvo na pasta Downloads'); }
function abre(f) { const r = new FileReader(); r.onload = () => { try { deJson(JSON.parse(r.result)); autosave(); msg('mapa aberto'); } catch (e) { msg('erro: ' + e.message); } }; r.readAsText(f); }
if (!new URLSearchParams(location.search).has('novo')) try { const salvo = localStorage.getItem('cabana_mapa_v2'); if (salvo) deJson(JSON.parse(salvo)); } catch (e) { }
if (new URLSearchParams(location.search).has('demot')) {   // exemplo do terreno novo: ?demot&x=12&y=12
  for (let cy = 4; cy < 20; cy++) for (let cx = 4; cx < 20; cx++) MAP[cy][cx] = 'grama_baixa';
  for (let cx = 6; cx < 19; cx++) MAP[12][cx] = 'terra_nova';
  for (let cy = 12; cy < 18; cy++) MAP[cy][14] = 'terra_nova';
  for (let cy = 7; cy < 11; cy++) for (let cx = 8; cx < 12; cx++) MAP[cy][cx] = 'terra_nova';
  MAP[16][8] = 'terra_nova'; MAP[15][18] = 'terra_nova'; MAP[15][17] = 'terra_nova';
  TERR.render();
}
// ---------- jogo ----------
const cv = document.getElementById('g'), ctx = cv.getContext('2d'), ui = document.getElementById('ui'); let K = 2, grade = false, ferr = { t: 'chao', id: 'terra_nova' }, editar = true, hsx = 0, hsy = 0, apertado = false;
const resize = () => { cv.width = innerWidth; cv.height = innerHeight; ctx.imageSmoothingEnabled = false; }; addEventListener('resize', resize); resize();
const VISIVEIS = ['grama_baixa', 'terra_nova'];
let larg = 1, inicio = null, snap = null;   // pincel (1x1, 2x2, 3x3), inicio do traco e copia do mapa para a linha reta
const atualizaUi = () => {
  ui.innerHTML = 'WASD / setas: andar · Shift: correr · roda: zoom · T: grade · E: mostra/esconde o editor';
  const pn = document.getElementById('painel'); pn.style.display = editar ? '' : 'none'; if (!editar) return;
  const bt = (t, id, img, nome) => '<button data-t="' + t + '" data-id="' + id + '" class="' + (ferr.t === t && ferr.id === id ? 'on' : '') + '"><img src="' + img + '">' + nome + '</button>';
  pn.innerHTML = '<h4>Chão (teclas 1 e 2)</h4><div class="g">' + VISIVEIS.map(m => bt('chao', m, MATS[m].icone, MATS[m].nome || m)).join('') + '</div>' +
    '<h4>' + 'Pincel · Shift + arrastar = linha reta' + '</h4><div class="g">' + [1, 2, 3].map(w => '<button data-w="' + w + '" class="' + (larg === w ? 'on' : '') + '">' + w + '×' + w + '</button>').join('') + '</div>' +
    '<h4>Objetos</h4><div class="g">' + Object.entries(OBJS).filter(([id, o]) => !o.deco).map(([id, o]) => bt('obj', id, o.src, o.nome)).join('') + bt('apagar', 'x', 'terreno/terra_0_0.png', 'Apagar objeto') + '</div>' +
    '<h4>Decorações</h4><div class="g">' + Object.entries(OBJS).filter(([id, o]) => o.deco).map(([id, o]) => bt('obj', id, o.src, o.nome)).join('') + '</div>' +
    '<div class="acoes"><button id="bSalvar">Salvar</button><button id="bAbrir">Abrir</button></div><input type="file" id="fArq" accept=".json" style="display:none"><div id="msg"></div>' +
    '<div style="margin-top:6px;font-size:11px;color:#bbb">Clique ou arraste para pintar. Decorações vão exatamente onde você clica; arraste para espalhar sem sobrepor. Botão direito apaga o objeto, ou a decoração sob o cursor. O mapa também fica guardado sozinho neste navegador.</div>';
  pn.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { larg = +b.dataset.w; atualizaUi(); });
  pn.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { ferr = { t: b.dataset.t, id: b.dataset.id }; atualizaUi(); });
  document.getElementById('bSalvar').onclick = baixa; document.getElementById('bAbrir').onclick = () => document.getElementById('fArq').click(); document.getElementById('fArq').onchange = e => e.target.files[0] && abre(e.target.files[0]);
}; atualizaUi();
addEventListener('wheel', e => { K = Math.max(1, Math.min(4, K + (e.deltaY < 0 ? 1 : -1))); });
const COL_BASE = .8;
// colisão da árvore = a pegada dela no chão (tronco + raízes, medida do desenho em arvores_do_gemini.mjs). O pé do personagem (um pontinho achatado) não entra nela.
// o sprite é desenhado com a ponta mais baixa das raízes no centro da célula (ponto de apoio cx,by); daí sai a posição do pé dentro do sprite
// âncora do sprite na tela: árvores = ponta mais baixa das raízes no centro da célula (+4 px); decorações = meio da base da imagem no ponto onde foram postas
function ancora(o) { const d = OBJS[o.id], sx = (o.x - o.y) * 64 + M * 64; return d.deco ? { sx, sy: (o.x + o.y) * 32, cx: d.im.naturalWidth / 2, by: d.im.naturalHeight - 1, e: ESCD } : { sx, sy: (o.x + o.y + 1) * 32 + 4, cx: d.cx, by: d.by, e: d.esc || 2 }; }
function bateArv(o, wx, wy) { const d = OBJS[o.id]; if (d.deco && !d.pe) return false;
  if (!d.pe) return Math.floor(wx) === o.x && Math.floor(wy) === o.y;   // árvores antigas: a célula inteira, como sempre foi
  const A = ancora(o), fx = (wx - wy) * 64 + M * 64, fy = (wx + wy) * 32;
  for (const [ax, ay] of [[0, 0], [-5, 0], [5, 0], [0, -2], [0, 2]]) { const px = A.cx + (fx + ax - A.sx) / A.e, py = Math.floor(A.by + (fy + ay - A.sy) / A.e), k = py - d.pe.y0; if (k >= 0 && k < d.pe.l.length && px >= d.pe.l[k] && px <= d.pe.r[k]) return true; }
  return false; }
let mostraCol = false;   // colisão da árvore = só o miolo da base do tronco (fração da largura medida); raízes e copa não bloqueiam
const keys = {}; addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyT') grade = !grade; if (e.code === 'KeyC') mostraCol = !mostraCol; if (e.code === 'KeyE') { editar = !editar; atualizaUi(); } const n = +e.key; if (n >= 1 && n <= VISIVEIS.length) { ferr = { t: 'chao', id: VISIVEIS[n - 1] }; atualizaUi(); } }); addEventListener('keyup', e => keys[e.code] = false);
function pintaMouse(e) {
  if (!editar) return; const gx = (e.clientX - cv.width / 2) / K + hsx - M * 64, gy = (e.clientY - cv.height / 2) / K + hsy, cx = Math.floor((gx / 64 + gy / 32) / 2), cy = Math.floor((gy / 32 - gx / 64) / 2);
  if (cx < 0 || cy < 0 || cx >= M || cy >= M) return; const i = objEm(cx, cy), fx = (gx / 64 + gy / 32) / 2, fy = (gy / 32 - gx / 64) / 2;
  if (e.button === 2 || ferr.t === 'apagar') { if (i >= 0) { objetos.splice(i, 1); autosave(); return; } let bj = -1, bz = -1e9; objetos.forEach((o, k) => { if (OBJS[o.id].deco && o.x + o.y > bz && opaco(o, gx, gy, 1)) { bz = o.x + o.y; bj = k; } }); if (bj >= 0) { objetos.splice(bj, 1); autosave(); } return; }
  if (ferr.t === 'chao') {
    const carimba = (x, y) => { const o = Math.floor((larg - 1) / 2); for (let j = 0; j < larg; j++) for (let k = 0; k < larg; k++) pinta(x - o + k, y - o + j, ferr.id); };
    if (e.type === 'pointerdown') { inicio = [cx, cy]; snap = MAP.map(r => r.slice()); }
    if (e.shiftKey && inicio) {   // linha reta ao longo do eixo da grade mais proximo da direcao do mouse
      for (let y = 0; y < M; y++) for (let x = 0; x < M; x++) if (MAP[y][x] !== snap[y][x]) pinta(x, y, snap[y][x]);
      const dx = cx - inicio[0], dy = cy - inicio[1], n = Math.max(Math.abs(dx), Math.abs(dy)), sx = Math.abs(dx) >= Math.abs(dy) ? Math.sign(dx) : 0, sy = sx ? 0 : Math.sign(dy);
      for (let t = 0; t <= n; t++) carimba(inicio[0] + sx * t, inicio[1] + sy * t);
    } else carimba(cx, cy);
    autosave(); } else if (ferr.t === 'obj') { if (OBJS[ferr.id].deco) { if (e.type === 'pointerdown' || !sobrepoe(ferr.id, fx, fy)) { objetos.push({ x: Math.round(fx * 100) / 100, y: Math.round(fy * 100) / 100, id: ferr.id, f: 1 }); autosave(); } } else { if (i >= 0) objetos.splice(i, 1); objetos.push({ x: cx, y: cy, id: ferr.id }); autosave(); } }
}
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => { apertado = true; pintaMouse(e); }); addEventListener('pointerup', () => { apertado = false; }); cv.addEventListener('pointermove', e => { if (apertado) pintaMouse(e); });
const P = PERS.create('NE'); let hx = M / 2 + .5, hy = M / 2 + .5, last = performance.now();
const q = new URLSearchParams(location.search); if (q.has('x')) hx = +q.get('x'); if (q.has('y')) hy = +q.get('y'); if (q.has('z')) K = +q.get('z');
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const dx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0), dy = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0), run = keys.ShiftLeft || keys.ShiftRight;
  PERS.step(P, dx, dy, run, now);
  if (dx || dy) { const v = (run ? 190 : 110) * dt; // pixels de tela
    const sxv = dx / Math.hypot(dx, dy) * v, syv = dy / Math.hypot(dx, dy) * v * .5;
    const nx = hx + (sxv / 64 + syv / 32) / 2, ny = hy + (syv / 32 - sxv / 64) / 2; const livre = (x, y) => x > .3 && y > .3 && x < M - .3 && y < M - .3 && !objetos.some(o => bateArv(o, x, y)); if (livre(nx, ny)) { hx = nx; hy = ny; } else if (livre(nx, hy)) hx = nx; else if (livre(hx, ny)) hy = ny; }
  hsx = (hx - hy) * 64 + M * 64; hsy = (hx + hy) * 32; const cx = cv.width / 2, cy = cv.height / 2;
  ctx.fillStyle = '#16120e'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.save(); ctx.imageSmoothingEnabled = false; ctx.translate(Math.round(cx - hsx * K), Math.round(cy - hsy * K)); ctx.scale(K, K);
  if (TERR.cv) ctx.drawImage(TERR.cv, 0, 0);
  if (grade) { ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1 / K; ctx.beginPath(); for (let i = 0; i <= M; i++) { ctx.moveTo(M * 64 + i * 64, i * 32); ctx.lineTo(M * 64 + i * 64 - M * 64, i * 32 + M * 32); ctx.moveTo(M * 64 - i * 64, i * 32); ctx.lineTo(M * 64 - i * 64 + M * 64, i * 32 + M * 32); } ctx.stroke(); }
  const lista = objetos.map(o => OBJS[o.id].deco ? { d: o.x + o.y + (OBJS[o.id].pe ? (OBJS[o.id].pe.y0 - (OBJS[o.id].im.naturalHeight - 1)) * ESCD / 32 : 0), f: () => desenhaObj(ctx, o, Math.round((o.x - o.y) * 64 + M * 64), Math.round((o.x + o.y) * 32)) } : { d: o.x + o.y + 1 + ((OBJS[o.id].pe ? OBJS[o.id].pe.y0 - OBJS[o.id].by + 4 : 0) * (OBJS[o.id].esc || 2)) / 32, f: () => desenhaObj(ctx, o, Math.round((o.x - o.y) * 64 + M * 64), Math.round((o.x + o.y + 1) * 32)) });
  lista.push({ d: hx + hy, f: () => PERS.draw(ctx, P, hsx, hsy) }); if (mostraCol) lista.push({ d: 1e9, f: () => { ctx.strokeStyle = '#ff2d2d'; ctx.lineWidth = 1 / K; for (const o of objetos) { const d = OBJS[o.id]; if (!d.pe) continue; const A = ancora(o), X = px => A.sx + (px - A.cx) * A.e, Y = k => A.sy + (d.pe.y0 + k - A.by) * A.e; ctx.beginPath(); d.pe.l.forEach((v, k) => { k ? ctx.lineTo(X(v), Y(k)) : ctx.moveTo(X(v), Y(k)); }); for (let k = d.pe.r.length - 1; k >= 0; k--) ctx.lineTo(X(d.pe.r[k]), Y(k)); ctx.closePath(); ctx.stroke(); } ctx.fillStyle = '#2dff2d'; ctx.fillRect(hsx - 1, hsy - 1, 2, 2); } }); lista.sort((a, b) => a.d - b.d).forEach(it => it.f()); ctx.restore(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
