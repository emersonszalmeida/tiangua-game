<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><title>Editor do mapa</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#1d2420;overflow:hidden;font:14px system-ui;color:#eee;user-select:none}
canvas{display:block;width:100vw;height:100vh}
#painel{position:fixed;left:10px;top:10px;width:228px;background:rgba(20,16,12,.88);border:1px solid #5a4630;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 60px);overflow:auto}
#painel h3{margin:4px 0 0;font-size:12px;color:#c9b48f;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.fer{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button,select{font:13px system-ui;background:#3a3028;color:#eee;border:1px solid #5a4630;border-radius:5px;padding:6px 8px;cursor:pointer;text-align:left}
button:hover:not(:disabled){background:#5a4630}button:disabled{opacity:.4;cursor:default}
button.on{background:#8a5a1c;border-color:#ffd76a}
button kbd{float:right;color:#b9a98f;font:11px system-ui}
#status{position:fixed;left:10px;bottom:10px;background:rgba(20,16,12,.88);border:1px solid #5a4630;border-radius:6px;padding:6px 10px;font-size:12.5px;line-height:1.5;max-width:calc(100vw - 40px)}
#aviso{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:rgba(20,16,12,.92);border:1px solid #ffd76a;color:#ffd76a;padding:6px 14px;border-radius:6px;opacity:0;transition:opacity .25s;pointer-events:none}
.dica{font-size:12px;color:#b9a98f;line-height:1.45}
</style></head><body>
<canvas id="c"></canvas>
<div id="painel">
  <h3>Ferramenta</h3>
  <div class="fer">
    <button id="f_v" class="on">Selecionar <kbd>V</kbd></button>
    <button id="f_d">Desenhar <kbd>D</kbd></button>
    <button id="f_a">Apagar área <kbd>A</kbd></button>
    <button id="f_c">Cortar trecho <kbd>C</kbd></button>
  </div>
  <h3>Tipo da rua</h3>
  <select id="tipo">
    <option value="bairro">Rua de bairro (6,5 m)</option>
    <option value="media">Rua média (8 m)</option>
    <option value="avenida">Avenida (9 m)</option>
    <option value="principal">Via principal (11 m)</option>
    <option value="br">BR — 4 pistas (14 m)</option>
  </select>
  <div class="dica" id="dicaTipo">Vale para o que você desenhar. Com uma rua selecionada, troca o tipo dela.</div>
  <h3>Ações</h3>
  <div class="fer">
    <button id="b_des">Desfazer <kbd>Ctrl+Z</kbd></button>
    <button id="b_ref">Refazer <kbd>Ctrl+Y</kbd></button>
    <button id="b_del">Apagar rua <kbd>Del</kbd></button>
    <button id="b_fit">Ver tudo <kbd>Home</kbd></button>
    <button id="b_limpa">Limpar pontos <kbd>S</kbd></button>
  </div>
  <h3>Mapa</h3>
  <div class="fer">
    <button id="b_grade" class="on">Grade <kbd>G</kbd></button>
    <button id="b_exp">Exportar</button>
  </div>
  <button id="b_orig">Voltar ao mapa original</button>
  <div class="dica" id="ajuda"></div>
</div>
<div id="status"></div><div id="aviso"></div>
<script src="ruas_jogo_br.js"></script>
