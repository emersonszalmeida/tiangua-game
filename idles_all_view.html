<!doctype html><html><head><meta charset="utf-8"><title>idles</title><style>body{margin:0;background:#202020;color:#eee;font:13px system-ui;padding:10px;display:flex;gap:14px;align-items:flex-start}.c{background:#8c8c8c;color:#111;padding:6px;text-align:center;border-radius:4px}canvas,img{image-rendering:pixelated;display:block}</style></head><body>
<script src="sprites7.js"></script><script src="idles.js"></script><script>
function mk(rows,k,flip){const c=document.createElement('canvas');c.width=rows[0].length*k;c.height=rows.length*k;const x=c.getContext('2d');if(flip){x.translate(c.width,0);x.scale(-1,1)}rows.forEach((r,y)=>{for(let q=0;q<r.length;q++)if(r[q]!=='.'){x.fillStyle=IDLES.pal[r[q]]||'#f0f';x.fillRect(q*k,y*k,k,k)}});return c}
const a=document.createElement('div');a.className='c';const i=new Image();i.src='cut_SE.png';i.style.height='460px';a.appendChild(i);a.append('seu recorte SE');document.body.appendChild(a);
for(const [t,rows,k,fl] of [['SE convertido (SW espelhado)',IDLES.SW.rows,8,true],['SW como usado',IDLES.SW.rows,8,false]]){const d=document.createElement('div');d.className='c';d.appendChild(mk(rows,k,fl));d.append(t);document.body.appendChild(d)}
const b=document.createElement('div');b.className='c';const i2=new Image();i2.src='draw_NW2.png';i2.style.height='460px';b.appendChild(i2);b.append('seu NW refeito');document.body.appendChild(b);
const d=document.createElement('div');d.className='c';d.appendChild(mk(IDLES.NW.rows,8,false));d.append('NW preenchido '+IDLES.NW.w+'x'+IDLES.NW.h);document.body.appendChild(d);
</script></body></html>
